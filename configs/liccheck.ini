# Política de licenças usada pelo job `licencas` quando o projeto não traz um
# `liccheck.ini` próprio.
#
# O contexto que define esta lista: os projetos do rigst são publicados sob
# AGPL-3.0. Uma obra derivada sob AGPL pode incorporar código permissivo (MIT,
# BSD, Apache-2.0, ISC) e código copyleft da mesma família (LGPL, GPL-3.0,
# AGPL-3.0). O que ela não pode incorporar é código proprietário, código sem
# permissão de redistribuição, e — o caso que de fato aparece na prática —
# código cuja licença ninguém declarou.
#
# Por isso o job roda com `--level CAUTIOUS`: pacote cuja licença não casa com
# nenhuma linha abaixo é reprovado em vez de passar despercebido. Violação
# explícita de GPL numa casa que já é AGPL quase não acontece; metadado
# ausente acontece toda semana.
#
# ---------------------------------------------------------------------------
# COMO O LICCHECK COMPARA (verificado na 0.9.2, lendo command_line.py)
#
# A comparação é **igualdade exata de string**, não substring e não regex — o
# modo regex só existe sob `--as-regex`, que este pipeline não usa. Antes de
# comparar, o liccheck aplica nesta ordem:
#
#   1. prefere os `Classifier: License ::` do pacote ao campo `License`;
#   2. remove **um** sufixo " license" do fim ("Apache Software License" vira
#      "Apache Software", "MIT License" vira "MIT");
#   3. divide em " OR " ("Apache-2.0 OR BSD-2-Clause" vira duas entradas);
#   4. passa tudo para minúsculas.
#
# Duas consequências que custam tempo se ignoradas:
#
#   - escrever "mit license" aqui é inútil: essa string nunca chega à
#     comparação, porque o passo 2 já a transformou em "mit". As entradas
#     abaixo estão na forma **pós-normalização**.
#   - o mesmo pacote muda de forma conforme declare classifier antigo
#     ("BSD License") ou expressão SPDX moderna ("BSD-3-Clause"). As duas
#     precisam estar listadas; é por isso que a lista parece redundante.
# ---------------------------------------------------------------------------

[Licenses]
authorized_licenses:
    # --- Permissivas, forma SPDX ---
    mit
    mit-0
    mit-cmu
    bsd
    bsd-2-clause
    bsd-3-clause
    0bsd
    isc
    apache-2.0
    psf-2.0
    python-2.0
    zlib
    unlicense
    cc0-1.0
    postgresql
    ncsa
    hpnd

    # Expressões compostas. O liccheck divide a licença em " OR ", mas **não**
    # em " AND ": um pacote sob "Apache-2.0 AND MIT" chega à comparação como
    # uma string só, e precisa estar listado inteiro mesmo que as duas metades
    # já estejam acima. Estas foram encontradas nas dependências reais dos
    # projetos (aiohttp, greenlet); outras vão aparecer, e o conserto é
    # acrescentar a linha, não afrouxar o nível.
    apache-2.0 and mit
    mit and psf-2.0

    # --- Permissivas, forma de classifier antigo (pós-normalização) ---
    apache software
    apache license 2.0
    bsd 3-clause
    new bsd
    simplified bsd
    zero-clause bsd
    isc (iscl)
    isc (iscl) (isc)
    python software foundation
    zlib/libpng
    the unlicense (unlicense)
    cc0 1.0 universal (cc0 1.0) public domain dedication
    public domain
    historical permission notice and disclaimer (hpnd)
    academic free (afl)
    artistic

    # --- Copyleft fraco: linkagem sem contaminar, compatível com AGPL-3.0 ---
    lgpl-2.1
    lgpl-2.1-only
    lgpl-2.1-or-later
    lgpl-3.0
    lgpl-3.0-only
    lgpl-3.0-or-later
    mpl-1.1
    mpl-2.0
    gnu lesser general public license v2 (lgplv2)
    gnu lesser general public license v2 or later (lgplv2+)
    gnu lesser general public license v3 (lgplv3)
    gnu lesser general public license v3 or later (lgplv3+)
    gnu library or lesser general public license (lgpl)
    mozilla public license 1.1 (mpl 1.1)
    mozilla public license 2.0 (mpl 2.0)
    eclipse public license 2.0 (epl-2.0)

    # --- Copyleft forte: permitido porque a obra final já é AGPL-3.0 ---
    gpl-2.0-or-later
    gpl-3.0
    gpl-3.0-only
    gpl-3.0-or-later
    agpl-3.0
    agpl-3.0-only
    agpl-3.0-or-later
    gnu general public license v2 or later (gplv2+)
    gnu general public license v3 (gplv3)
    gnu general public license v3 or later (gplv3+)
    gnu affero general public license v3
    gnu affero general public license v3 or later (agplv3+)

    # --- Fontes e conteúdo, quando embarcados como pacote Python ---
    ofl-1.1
    sil open font license 1.1

    # --- Strings livres, auditadas uma a uma ---
    #
    # Estes pacotes não declaram classifier nem License-Expression: só um campo
    # `License` em texto corrido, que nenhuma normalização transforma em SPDX.
    # Entram como literal porque a string é específica o bastante para não
    # autorizar outra coisa por acidente. Encontrados nos venvs de produção em
    # 2026-08-14 (sistema_questoes).
    #
    # pymupdf — "Dual Licensed - GNU AFFERO GPL 3.0 or Artifex Commercial
    # License". Escolhemos o ramo AGPL, compatível porque os projetos já são
    # AGPL-3.0. ATENÇÃO: essa escolha é de mão única — enquanto o pymupdf
    # estiver embarcado, o projeto não pode ser relicenciado para nada mais
    # permissivo sem comprar a licença da Artifex.
    dual licensed - gnu affero gpl 3.0 or artifex commercial
    #
    # pypdfium2 — "BSD-3-Clause, Apache-2.0, dependency licenses". As duas
    # nomeadas são permissivas; "dependency licenses" refere-se ao PDFium, que
    # é BSD-3-Clause. Nada aqui restringe a distribuição sob AGPL.
    bsd-3-clause, apache-2.0, dependency licenses

# Reprovadas mesmo que apareçam por engano acima: impedem a redistribuição sob
# AGPL. `gpl-2.0-only` está aqui, e não entre as autorizadas, porque GPL-2.0
# sem a cláusula "or later" é incompatível com AGPL-3.0 — a forma "or later"
# é compatível, e por isso está na lista de cima.
unauthorized_licenses:
    gpl-2.0-only
    gnu general public license v2 (gplv2)
    proprietary
    commercial
    other/proprietary
    all rights reserved

# Exceções auditadas, no formato `pacote: faixa-de-versão`. Cada entrada
# precisa de um comentário dizendo quem auditou e por quê — sem isso a seção
# vira o lugar onde se cala a ferramenta, que é o modo de falha desta
# checagem. Preferir corrigir o metadado upstream a listar aqui.
[Authorized Packages]
