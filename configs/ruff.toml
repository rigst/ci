# Baseline do ruff usado quando o projeto não traz configuração própria.
# Para divergir, crie um ruff.toml ou [tool.ruff] no seu pyproject.toml —
# o workflow detecta e passa a usar o do projeto.

target-version = "py312"
line-length = 100

exclude = [
    "migrations",
    ".venv",
    "venv",
    "node_modules",
    "static",
    ".ci-shared",
]

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "DJ",   # flake8-django
    "C4",   # comprehensions
    "RUF",  # regras do próprio ruff
]

ignore = [
    "E501",  # comprimento de linha fica com o formatter
    "B008",  # chamada em default de argumento: padrão comum no Django/DRF
    # RUF001-003 reclamam de caractere não-ASCII "ambíguo". Num projeto escrito
    # em português, com acentuação e tipografia correta (×, —, aspas curvas),
    # isso é ruído puro: são milhares de ocorrências legítimas.
    "RUF001",
    "RUF002",
    "RUF003",
]

# As regras `S` (bandit) ficam de fora de propósito: o pipeline roda o bandit
# num job próprio, sobre os mesmos arquivos e com as mesmas checagens. Mantê-las
# aqui fazia todo achado de segurança aparecer duas vezes, e — pior — fazia o
# job de lint ficar vermelho por questão de segurança, que tem tratamento
# separado (severidade, confiança, soft-fail próprio) no job do bandit.

[lint.per-file-ignores]
# Settings do Django legitimamente usam import * e nomes em maiúscula.
"**/settings/*.py" = ["F403", "F405"]
"**/settings.py" = ["F403", "F405"]

# PERIGOSO SEM ISTO. O `ready()` de um AppConfig importa o módulo de signals
# só pelo efeito colateral de registrar os receivers. Para o ruff é import não
# usado, e `--fix` o substitui por `pass` — silenciosamente desligando todos os
# signals do app. O build segue verde se nenhum teste cobrir aquele signal.
# Aconteceu em sistema_orcamentos: o recálculo de totais parou de rodar.
#
# RUF100 vem junto por consequência: desligar F401 aqui torna "inútil" todo
# `# noqa: F401` que já existia nos apps.py, e o RUF100 reprova diretiva
# inútil. Os noqa não devem ser removidos — eles são a única proteção em
# projeto que use config própria de ruff, sem estas per-file-ignores. Sem esta
# linha, seis dos sete projetos quebram no primeiro ruff depois da mudança.
"**/apps.py" = ["F401", "RUF100"]

# RUF012 quer ClassVar em todo atributo de classe mutável. Isso pega bug de
# verdade em classe comum, mas em Django dispara no que é idioma da framework:
# `class Meta: fields = [...]`, `widgets = {...}`, `TIPO_CHOICES = [...]`,
# `list_display`. Anotar tudo com ClassVar não é convenção em Django, então a
# regra fica desligada só nos módulos onde esse padrão vive — e ativa no resto.
# Os padrões `*_*.py` cobrem a convenção de dividir um módulo grande em vários
# (forms_empresa.py, models_financeiro.py), usada nos projetos.
"**/models.py" = ["RUF012"]
"**/models_*.py" = ["RUF012"]
"**/models/*.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
"**/forms_*.py" = ["RUF012"]
"**/forms/*.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/admin_*.py" = ["RUF012"]
"**/admin/*.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]

[lint.isort]
known-first-party = ["config"]
