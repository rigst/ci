# Baseline do ruff usado quando o projeto não traz configuração própria.
# Para divergir, crie um ruff.toml ou [tool.ruff] no seu pyproject.toml —
# o workflow detecta e passa a usar o do projeto.

target-version = "py312"
line-length = 100

exclude = [
    "migrations",
    ".venv",
    "venv",
    "node_modules",
    "static",
    ".ci-shared",
]

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "DJ",   # flake8-django
    "S",    # bandit (sobreposição barata com o job de segurança)
    "C4",   # comprehensions
    "RUF",  # regras do próprio ruff
]

ignore = [
    "E501",  # comprimento de linha fica com o formatter
    "B008",  # chamada em default de argumento: padrão comum no Django/DRF
    # RUF001-003 reclamam de caractere não-ASCII "ambíguo". Num projeto escrito
    # em português, com acentuação e tipografia correta (×, —, aspas curvas),
    # isso é ruído puro: são milhares de ocorrências legítimas.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# Testes usam assert e senhas fictícias; não é achado de segurança.
# `tests_*.py` cobre a convenção usada nos projetos, em que cada app tem
# vários módulos de teste (tests_leitor.py, tests_video.py, ...).
"**/tests.py" = ["S101", "S105", "S106"]
"**/tests/**" = ["S101", "S105", "S106"]
"**/test_*.py" = ["S101", "S105", "S106"]
"**/tests_*.py" = ["S101", "S105", "S106"]
"**/conftest.py" = ["S101", "S105", "S106"]
# Settings do Django legitimamente usam import * e nomes em maiúscula.
"**/settings/*.py" = ["F403", "F405"]
"**/settings.py" = ["F403", "F405"]

# RUF012 quer ClassVar em todo atributo de classe mutável. Isso pega bug de
# verdade em classe comum, mas em Django dispara no que é idioma da framework:
# `class Meta: fields = [...]`, `widgets = {...}`, `TIPO_CHOICES = [...]`,
# `list_display`. Anotar tudo com ClassVar não é convenção em Django, então a
# regra fica desligada só nos módulos onde esse padrão vive — e ativa no resto.
"**/models.py" = ["RUF012"]
"**/models/*.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
"**/forms/*.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/admin/*.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]

[lint.isort]
known-first-party = ["config"]
