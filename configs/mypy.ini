; Baseline permissivo do mypy: serve para começar a tipar um projeto Django
; existente sem afogar o CI em erros no primeiro dia.
;
; Por isso `mypy` vem em soft-fail por padrão no workflow. O caminho de adoção
; é: manter permissivo até zerar os erros, tirar do soft-fail, e só então
; apertar as opções abaixo (começando por disallow_untyped_defs).

[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = False
check_untyped_defs = True
disallow_untyped_defs = False
no_implicit_optional = True
show_error_codes = True
pretty = True

exclude = (?x)(
      /migrations/
    | ^\.venv/
    | ^venv/
    | ^\.ci-shared/
    | ^node_modules/
  )

; Migrações são geradas pelo Django; tipá-las não agrega.
[mypy-*.migrations.*]
ignore_errors = True

; Testes costumam usar factories e mocks pouco tipados.
[mypy-*.tests.*]
ignore_errors = True
