; Baseline permissivo do mypy: serve para começar a tipar um projeto Django
; existente sem afogar o CI em erros no primeiro dia.
;
; Por isso `mypy` vem em soft-fail por padrão no workflow. O caminho de adoção
; é: manter permissivo até zerar os erros, tirar do soft-fail, e só então
; apertar as opções abaixo (começando por disallow_untyped_defs).

[mypy]
; Sem este plugin o mypy não entende Django e inventa erro em código correto:
; campo de model vira "Need type annotation", get_FOO_display() e relação
; reversa de related_name viram "has no attribute". No sistema_arq eram 382
; erros; com o plugin, 64 — os 318 restantes nunca foram do código.
;
; A seção [mypy.plugins.django-stubs] NÃO está aqui de propósito: ela exige
; django_settings_module, que é por projeto. O workflow acrescenta a seção a
; uma cópia deste arquivo, usando o input django-settings-module. Rodando
; mypy à mão com esta config, acrescente você mesmo — o plugin recusa subir
; sem ela, e não lê DJANGO_SETTINGS_MODULE do ambiente.
plugins = mypy_django_plugin.main
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = False
check_untyped_defs = True
disallow_untyped_defs = False
no_implicit_optional = True
show_error_codes = True
pretty = True

exclude = (?x)(
      /migrations/
    | ^\.venv/
    | ^venv/
    | ^\.ci-shared/
    | ^node_modules/
    ; Acompanha o python_files do pytest: tests_*.py e test_*.py. Um arquivo
    ; como test_release_e2e.py escaparia da seção [mypy-*.tests.*] abaixo.
    | (^|/)tests?_[^/]*\.py$
  )

; Migrações são geradas pelo Django; tipá-las não agrega.
[mypy-*.migrations.*]
ignore_errors = True

; Testes costumam usar factories e mocks pouco tipados.
;
; As seções [mypy-...] NÃO servem para tests_*.py e test_*.py: o mypy exige
; nome de módulo qualificado e só aceita `*` como componente inteiro, então
; `[mypy-*.test_*]` é recusado com aviso. Por isso esses dois vão no `exclude`
; acima, que é por caminho. `tests.py` continua sendo checado de propósito.
[mypy-*.tests.*]
ignore_errors = True
