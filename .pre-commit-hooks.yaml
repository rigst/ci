# Hooks de pre-commit servidos por este repo. Uso nos apps: ver
# examples/pre-commit-config.yaml e RUNBOOK seção 11.
- id: ruff-ci
  name: ruff (mesma versão e config do CI)
  entry: scripts/pre_commit_ruff.py check
  language: script
  types_or: [python, pyi]
  require_serial: true

- id: ruff-format-ci
  name: ruff format (mesma versão e config do CI)
  entry: scripts/pre_commit_ruff.py format
  language: script
  types_or: [python, pyi]
  require_serial: true
