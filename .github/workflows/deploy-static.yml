name: Deploy site estático (CD)

# Mesmo mecanismo do deploy-django.yml (ver comentários lá), sem venv,
# systemd nem healthcheck: o "deploy" de um site estático é só o nginx
# passar a servir arquivos novos, e isso já acontece assim que o
# cd-deploy.sh do projeto faz `git merge --ff-only` no checkout que o nginx
# aponta como `root`.

on:
  workflow_call:
    inputs:
      ssh-host:
        description: "Host ou domínio do servidor onde o site roda."
        type: string
        required: true
      ssh-user:
        description: "Usuário SSH dedicado ao deploy (não o usuário admin do servidor)."
        type: string
        default: "deploy"
    secrets:
      CD_SSH_KEY:
        description: "Chave privada correspondente à pública em ~deploy/.ssh/authorized_keys deste site."
        required: true

permissions:
  contents: read

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Gravar chave privada
        # printf '%s\n', não '%s': a expressão ${{ }} do Actions corta a
        # quebra de linha final do secret ao interpolar, e uma chave OpenSSH
        # sem \n depois de "-----END...-----" faz o libcrypto recusar com um
        # erro sem relação nenhuma com a causa real.
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cd_key"
          printf '%s\n' "${{ secrets.CD_SSH_KEY }}" > "$RUNNER_TEMP/cd_key"

      - name: Fixar known_hosts
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s' "${{ vars.SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"

      - name: Disparar deploy no servidor
        # head_sha só existe no evento workflow_run; o fallback pra github.sha
        # permite testar via workflow_dispatch antes de trocar o gatilho.
        #
        # Retry só na CONEXÃO, nunca no resultado do deploy (ver
        # deploy-django.yml, mesmo mecanismo): o grep no stderr distingue
        # falha transitória de rede de erro de verdade do cd-deploy.sh.
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for tentativa in 1 2 3; do
            # if/then, não "saida=$(...); codigo=$?" solto: sob bash -e uma
            # atribuição a partir de command substitution que falha dispara
            # o errexit ali mesmo, matando a lógica de retry inteira (ver
            # deploy-django.yml). O "if" é a exceção documentada do -e.
            if saida="$(ssh -i "$RUNNER_TEMP/cd_key" \
                -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
                -o StrictHostKeyChecking=yes \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}" \
                "deploy $DEPLOY_SHA" 2>&1)"; then
              codigo=0
            else
              codigo=$?
            fi
            printf '%s\n' "$saida"
            [ "$codigo" -eq 0 ] && exit 0
            if printf '%s' "$saida" | grep -qE "Connection timed out|Connection refused|Could not resolve|Connection closed by remote host|kex_exchange_identification|Connection reset by peer"; then
              echo "Falha de conexão (tentativa $tentativa/3), tentando de novo em 10s..."
              sleep 10
              continue
            fi
            exit "$codigo"
          done
          echo "Sem conexão após 3 tentativas."
          exit 1
