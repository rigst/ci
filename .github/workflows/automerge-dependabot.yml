# Merge automático dos PRs do Dependabot que só corrigem CVE (reutilizável).
#
# O app chama este workflow quando o CI de um PR termina (workflow_run): ver
# examples/caller-automerge-dependabot.yml. A decisão está em
# scripts/automerge_dependabot.py; o resumo das regras:
#
#   mergeia sozinho se: só requirements.txt/.lock mudaram, o CI inteiro passou
#   no commit atual, o pip-audit acha CVE na main que o PR corrige, nenhuma CVE
#   nova, toda dependência direta que muda tinha CVE, e nada sobe de versão
#   maior (nem transitiva). Senão: comenta o motivo e deixa para revisão.
#
# Segurança: roda no contexto da main (workflow_run usa o workflow da branch
# padrão), o script vem do rigst/ci e o código do PR nunca é executado, só lido
# com `git show`. Depois do merge dispara o CI da main: merge pelo GITHUB_TOKEN
# não gera push, e sem CI na main o CD não roda (RUNBOOK 9.3).
name: Auto-merge de CVE (reutilizável)

on:
  workflow_call:
    inputs:
      head-branch:
        type: string
        required: true
      head-sha:
        description: "Commit cujo CI passou. Vazio (disparo à mão): o commit atual do PR."
        type: string
        default: ""
      seco:
        description: "Só decide e mostra; não comenta, não mergeia, não dispara."
        type: boolean
        default: false
      ci-ref:
        description: |
          Commit do rigst/ci de onde vem o script. Vazio: o SHA do `uses:`,
          lido no arquivo do chamador (ver o passo "Resolver o commit").
        type: string
        default: ""

permissions:
  contents: read

jobs:
  automerge:
    name: auto-merge de CVE
    if: startsWith(inputs.head-branch, 'dependabot/pip/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # merge e update-branch
      pull-requests: write   # comentário com o veredito
      actions: write         # workflow_dispatch do CI
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # De qual commit do rigst/ci vêm configs e scripts. Ordem: `ci-ref`
      # explícito; `job_workflow_sha` (documentado, mas chega VAZIO nos runners);
      # a ref do `uses:` lida no próprio arquivo do chamador (`github.workflow_ref`
      # aponta para ele). Sem fallback para `v1`: ref errada falha aqui, com o
      # motivo, e não lá na frente com "No such file" (README, seção ci-ref).
      - name: Resolver o commit do rigst/ci
        id: ciref
        env:
          PEDIDO: ${{ inputs.ci-ref }}
          JOB_SHA: ${{ github.job_workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REUSAVEL: automerge-dependabot.yml
        run: |
          ref="${PEDIDO:-$JOB_SHA}"
          origem="input/job_workflow_sha"
          if [ -z "$ref" ]; then
            arq="${WORKFLOW_REF#*/.github/workflows/}"
            arq=".github/workflows/${arq%%@*}"
            ref=$(grep -oE "rigst/ci/\.github/workflows/${REUSAVEL}@[^[:space:]#\"']+" "$arq" | head -1 | cut -d@ -f2 || true)
            origem="$arq"
          fi
          if [ -z "$ref" ]; then
            echo "::error::não achei a ref do rigst/ci no uses: de $arq; passe ci-ref"
            exit 1
          fi
          echo "rigst/ci para .ci-shared: $ref (de $origem)"
          echo "sha=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ steps.ciref.outputs.sha }}
          path: .ci-shared
          persist-credentials: false

      - name: Conferir que o script veio do commit pedido
        env:
          CI_REF: ${{ steps.ciref.outputs.sha }}
        run: |
          test -f .ci-shared/scripts/automerge_dependabot.py || {
            echo "::error::rigst/ci@$CI_REF não tem scripts/automerge_dependabot.py"; exit 1; }
          echo "rigst/ci em $(git -C .ci-shared rev-parse --short HEAD)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        env:
          PIP_AUDIT_VERSION: "2.10.1"
        run: |
          pip install --only-binary :all: "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Decidir e mergear
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
          HEAD_SHA: ${{ inputs.head-sha }}
          SECO: ${{ inputs.seco && 'sim' || '' }}
        run: |
          if [ "$SECO" = sim ]; then
            python .ci-shared/scripts/automerge_dependabot.py --seco
          else
            python .ci-shared/scripts/automerge_dependabot.py
          fi
