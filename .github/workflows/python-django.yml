name: Python/Django CI

# Pipeline reutilizável usado pelos projetos Django do rigst.
# Uso mínimo no repo chamador:
#
#   jobs:
#     ci:
#       uses: rigst/ci/.github/workflows/python-django.yml@v1
#       secrets: inherit
#
# Cada etapa pode ser desligada por input, e `soft-fail` permite adoção
# gradual: a checagem roda e reporta, mas não derruba o build.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Versão do Python usada em todos os jobs."
        type: string
        default: "3.12"

      requirements-file:
        description: "Arquivo de dependências de runtime."
        type: string
        default: "requirements.txt"

      dev-requirements-file:
        description: "Dependências de desenvolvimento/teste. Vazio = ignora."
        type: string
        default: ""

      source-paths:
        description: "Pastas analisadas por mypy e bandit (separadas por espaço)."
        type: string
        default: "."

      django-settings-module:
        description: "DJANGO_SETTINGS_MODULE usado em check --deploy e nas migrações."
        type: string
        default: ""

      django-env:
        description: |
          Variáveis extras para os comandos do Django, uma por linha (CHAVE=valor).
          Valores fictícios de CI — nunca coloque segredo real aqui.
        type: string
        default: ""

      # Testes não podem rodar sob os settings de produção: SECURE_SSL_REDIRECT
      # transforma todo request do test client em 301, e as travas de produção
      # (SSL no banco, segredo obrigatório) derrubam a suíte antes de começar.
      # Por isso o job de testes tem settings próprios.
      test-settings-module:
        description: |
          DJANGO_SETTINGS_MODULE usado só no job de testes.
          Vazio = usa django-settings-module.
        type: string
        default: ""

      test-env:
        description: |
          Variáveis aplicadas só no job de testes, uma por linha (CHAVE=valor).
          Aplicadas depois de django-env, então repetir uma chave sobrescreve —
          basta declarar as diferenças.
        type: string
        default: ""

      django-check-fail-level:
        description: "Nível mínimo que faz `check --deploy` falhar."
        type: string
        default: "WARNING"

      postgres:
        description: "Sobe um serviço PostgreSQL para o job de testes."
        type: boolean
        default: true

      postgres-version:
        description: "Tag da imagem do PostgreSQL."
        type: string
        default: "16"

      coverage-fail-under:
        description: "Cobertura mínima aceita. 0 desliga o limite."
        type: number
        default: 0

      apt-packages:
        description: |
          Pacotes apt instalados antes dos testes, separados por espaço. Para
          projetos que dependem de binário de sistema (poppler-utils,
          ghostscript, libmagic1). Vale só no job de testes.
        type: string
        default: ""

      bandit-severity:
        description: |
          Severidade a partir da qual o bandit derruba o build: all, low,
          medium ou high. O relatório completo é impresso de qualquer forma.
        type: string
        default: "high"

      soft-fail:
        description: |
          Lista separada por vírgula das checagens que reportam sem derrubar o
          build. Valores aceitos: ruff, mypy, pytest, bandit, pip-audit,
          gitleaks, django, licencas, sbom, lock, e2e, a11y, diff, frontend,
          layout.
        type: string
        default: "mypy"

      # --- liga/desliga por etapa ---
      run-ruff:
        type: boolean
        default: true
      run-mypy:
        type: boolean
        default: true
      run-pytest:
        type: boolean
        default: true
      run-security:
        type: boolean
        default: true
      run-gitleaks:
        type: boolean
        default: true
      run-django-checks:
        type: boolean
        default: true
      run-codecov:
        description: "Envia cobertura ao Codecov. Requer secret CODECOV_TOKEN."
        type: boolean
        default: true
      run-sonar:
        description: "Roda o SonarQube Cloud. Requer secret SONAR_TOKEN."
        type: boolean
        default: false
      sonar-project-key:
        description: "Chave do projeto no SonarQube Cloud (ex.: rigst_sistema_arq)."
        type: string
        default: ""
      sonar-organization:
        description: "Chave da organização no SonarQube Cloud (ex.: rigst)."
        type: string
        default: ""
      sonar-args:
        description: "Propriedades extras do scanner, separadas por espaço (-Dchave=valor)."
        type: string
        default: ""

      # --- licenças e conformidade ---
      #
      # As cinco etapas abaixo nasceram desligadas de propósito. Ao contrário
      # das sete originais, quatro delas exigem alguma coisa do projeto (lock
      # gerado, teste marcado, rota para auditar), e as duas que não exigem
      # ainda assim mudariam o veredito de um pipeline que hoje está verde.
      # Ligar por padrão faria a próxima subida da tag `v1` quebrar sete
      # repositórios de uma vez, que é exatamente o que o `soft-fail` existe
      # para evitar. A ordem de adoção está no RUNBOOK.
      run-licencas:
        description: "Confere as licenças das dependências (liccheck) e publica o inventário."
        type: boolean
        default: false
      liccheck-level:
        description: |
          Rigor do liccheck: STANDARD (basta uma licença autorizada), CAUTIOUS
          (autorizada e nenhuma proibida junto) ou PARANOID (todas autorizadas).
        type: string
        default: "CAUTIOUS"

      # --- SBOM ---
      run-sbom:
        description: "Gera o SBOM CycloneDX do ambiente resolvido e publica como artefato."
        type: boolean
        default: false
      sbom-spec-version:
        description: "Versão do esquema CycloneDX."
        type: string
        default: "1.6"
      sbom-retention-days:
        description: |
          Retenção do SBOM em dias. Bem maior que a dos outros artefatos: o
          SBOM serve para responder, meses depois, se uma CVE recém-publicada
          atingia a versão que estava em produção naquele commit.
        type: number
        default: 90

      # --- dependências travadas por hash ---
      run-lock:
        description: |
          Confere o lock contra o requirements.txt e instala com
          --require-hashes. Exige um lock gerado por scripts/gerar_lock.py.
        type: boolean
        default: false
      lock-file:
        description: "Arquivo de lock com hashes."
        type: string
        default: "requirements.lock"
      lock-python-version:
        description: |
          Versão do Python para conferir a instalação do lock. Vazio = usa
          python-version. Só difere quando produção roda numa versão diferente
          da analisada pelo pipeline — o lock do sistema_arq é resolvido para
          o 3.14 da imagem, e conferi-lo no 3.12 acusaria divergência falsa.
        type: string
        default: ""

      # --- testes de ponta a ponta ---
      run-e2e:
        description: |
          Roda os testes marcados como e2e num navegador de verdade. Quando
          ligado, o job de testes comum passa a excluir esse marcador, para a
          suíte não rodar duas vezes.
        type: boolean
        default: false
      e2e-args:
        description: "Argumentos do pytest no job de e2e."
        type: string
        default: "-m e2e"
      pytest-markers:
        description: |
          Expressão extra de marcadores para o job de testes comum, combinada
          com a exclusão de `e2e`.

          Existe porque um `-m` na linha de comando SUBSTITUI o do `addopts` do
          pytest.ini, em vez de somar. Um projeto que exclua marcadores por lá
          perde a exclusão em silêncio assim que este pipeline passa o dele: no
          dojo, `visual` voltou a ser coletado e a suíte quebrou tentando abrir
          um navegador que o job não instala.
        type: string
        default: ""
      e2e-browser:
        description: "Navegador instalado pelo Playwright: chromium, firefox ou webkit."
        type: string
        default: "chromium"

      # --- acessibilidade ---
      run-a11y:
        description: "Audita acessibilidade com axe-core sobre o servidor de desenvolvimento."
        type: boolean
        default: false
      a11y-paths:
        description: |
          Caminhos auditados, um por linha (ex.: /, /entrar/). Sem isto o job
          não tem o que auditar e falha dizendo isso.
        type: string
        default: ""
      a11y-tags:
        description: "Tags de regra do axe-core, separadas por vírgula."
        type: string
        default: "wcag2a,wcag2aa,wcag21a,wcag21aa"
      a11y-fail-on:
        description: |
          Impacto a partir do qual a auditoria reprova: minor, moderate,
          serious, critical ou none (só relata).
        type: string
        default: "serious"
      a11y-setup-command:
        description: |
          Comando rodado depois do migrate e antes de subir o servidor, para
          semear os dados que as páginas auditadas precisam.
        type: string
        default: ""
      a11y-port:
        description: "Porta do servidor de desenvolvimento durante a auditoria."
        type: number
        default: 8001

      # --- qualidade do diff ---
      #
      # Etapa que responde "esta alteração aumentou a dívida?" em vez de "este
      # repositório está limpo?". Analisa só as linhas que o PR adiciona,
      # comparando com o merge-base — não há arquivo de baseline para manter,
      # conflitar em merge ou regravar para silenciar uma regra. Roda apenas em
      # pull_request: em push para a main não existe base contra a qual medir.
      run-diff-quality:
        description: "Cobra qualidade nas linhas que o PR adiciona."
        type: boolean
        default: false
      diff-quality-fail-on:
        description: |
          Severidade a partir da qual reprova: erro, aviso ou nenhum (só
          relata). Comece em `nenhum` para medir o passivo do projeto antes de
          apertar — o procedimento está no RUNBOOK.
        type: string
        default: "erro"
      diff-quality-limite-funcao:
        description: "Linhas a partir das quais uma função NOVA vira aviso."
        type: number
        default: 50
      diff-quality-limite-crescimento:
        description: "Crescimento de um arquivo, em %, que num único PR vira aviso."
        type: number
        default: 15

      # --- qualidade estática de frontend ---
      run-frontend:
        description: "Roda Stylelint no CSS, ESLint no JS e djlint nos templates."
        type: boolean
        default: false
      frontend-paths:
        description: |
          Diretórios com o CSS e o JS de origem, separados por espaço. Não use a
          raiz do repositório: o glob `**/*.css` a partir dela varre `venv/`
          inteiro e o job trava sem mensagem de erro.
        type: string
        default: "static"
      template-paths:
        description: "Diretórios com os templates Django, separados por espaço."
        type: string
        default: "templates"
      run-stylelint:
        description: "Parte de CSS da etapa de frontend."
        type: boolean
        default: true
      run-eslint:
        description: "Parte de JavaScript da etapa de frontend."
        type: boolean
        default: true
      run-djlint:
        description: "Parte de template da etapa de frontend."
        type: boolean
        default: true
      frontend-fail-on:
        description: |
          Severidade a partir da qual o frontend reprova: erro, aviso ou nenhum.

          Ao contrário do diff-quality, esta etapa analisa o arquivo inteiro, e
          portanto enxerga o passivo herdado — 221 seletores duplicados e 37
          achados de template na frota, medidos em 2026-09-10. Todo achado de
          Stylelint entra como aviso justamente por isso; o que sobra como erro
          é ESLint de severidade 2 e template estruturalmente quebrado, que na
          frota inteira estão em zero. Ainda assim, comece em `nenhum`.
        type: string
        default: "erro"

      # --- layout renderizado ---
      #
      # Mede o layout em várias larguras com o Playwright, em vez de comparar
      # screenshots. A comparação por pixel responde "mudou?", que reprova a
      # mudança legítima e aceita a quebra que já estava na referência; e
      # depende de as fontes do runner serem as da máquina onde a referência foi
      # gravada, que não são.
      run-layout:
        description: "Mede overflow, alvos de toque e conteúdo coberto no navegador."
        type: boolean
        default: false
      layout-paths:
        description: "Caminhos medidos, um por linha. Sem isto o job falha dizendo isso."
        type: string
        default: ""
      layout-larguras:
        description: "Larguras de viewport, em px, separadas por vírgula."
        type: string
        default: "390,768,1440"
      layout-fail-on:
        description: |
          Severidade a partir da qual reprova: erro, aviso ou nenhum. Comece em
          `nenhum`, como no a11y.
        type: string
        default: "erro"
      layout-alvo-minimo:
        description: "Lado mínimo de alvo clicável, em px (WCAG 2.5.8 pede 24)."
        type: number
        default: 24
      layout-setup-command:
        description: "Comando rodado depois do migrate, para semear os dados das telas medidas."
        type: string
        default: ""
      layout-port:
        description: "Porta do servidor de desenvolvimento durante a medição."
        type: number
        default: 8002

      ci-ref:
        description: |
          Ref de rigst/ci de onde vêm os configs e os scripts compartilhados.

          Vazio (padrão) usa `github.job_workflow_sha`: o commit exato deste
          arquivo de workflow. É o que garante que o YAML e os scripts que ele
          executa venham do MESMO commit.

          O padrão era `"v1"` fixo, e isso quebrou de verdade: um projeto fixou
          o workflow no SHA de um commit de trabalho, como o README manda, e os
          jobs seguiram baixando os scripts da tag `v1` — que não tinha os
          arquivos novos. O sintoma foi `No such file or directory` em quatro
          scripts, sem nenhuma pista de que o `.ci-shared` viera de outro
          commit. Passe um valor aqui apenas para forçar uma ref diferente da
          do workflow, o que quase nunca é o que se quer.
        type: string
        default: ""

    secrets:
      CODECOV_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "1"

jobs:
  # 1. ruff — lint rápido, roda primeiro porque é o feedback mais barato.
  ruff:
    name: ruff (lint)
    if: inputs.run-ruff
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'ruff') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Instalar ruff
        run: pip install ruff

      # Usa a config do próprio projeto se existir; senão, cai no baseline
      # compartilhado, para o repo funcionar sem configurar nada.
      - name: Selecionar configuração
        id: cfg
        run: |
          if [ -f pyproject.toml ] && grep -q "\[tool.ruff" pyproject.toml; then
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--config .ci-shared/configs/ruff.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: ruff check
        run: ruff check --output-format=github ${{ steps.cfg.outputs.args }} .

      - name: ruff format --check
        run: ruff format --check ${{ steps.cfg.outputs.args }} .

  # 2. mypy — type checking.
  mypy:
    name: mypy (tipos)
    if: inputs.run-mypy
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'mypy') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Instalar dependências
        run: |
          pip install -r "${{ inputs.requirements-file }}"
          if [ -n "${{ inputs.dev-requirements-file }}" ]; then
            pip install -r "${{ inputs.dev-requirements-file }}"
          fi
          pip install mypy django-stubs

      # O plugin do django-stubs importa os settings de verdade. Sem as
      # variáveis do projeto, esse import levanta ImproperlyConfigured e o mypy
      # nem chega a analisar o código.
      - name: Exportar variáveis do projeto
        run: |
          if [ -n "${{ inputs.django-settings-module }}" ]; then
            echo "DJANGO_SETTINGS_MODULE=${{ inputs.django-settings-module }}" >> "$GITHUB_ENV"
          fi
          # Descarta linhas vazias e comentários. O `|| true` é obrigatório:
          # com `set -e`, um grep sem correspondência (django-env vazio)
          # derrubaria o passo inteiro.
          printf '%s\n' "${{ inputs.django-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true

      - name: Selecionar configuração
        id: cfg
        run: |
          if grep -qs "\[tool.mypy\]" pyproject.toml || [ -f mypy.ini ] || [ -f .mypy.ini ] || [ -f setup.cfg ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            # Cópia, e não o arquivo original: a seção do django-stubs exige o
            # settings do projeto, que é diferente em cada um.
            cp .ci-shared/configs/mypy.ini "$RUNNER_TEMP/mypy.ini"
            {
              echo ""
              echo "[mypy.plugins.django-stubs]"
              echo "django_settings_module = ${{ inputs.django-settings-module }}"
            } >> "$RUNNER_TEMP/mypy.ini"
            echo "args=--config-file $RUNNER_TEMP/mypy.ini" >> "$GITHUB_OUTPUT"
          fi

      - name: mypy
        run: mypy ${{ steps.cfg.outputs.args }} ${{ inputs.source-paths }}

  # 3. pytest + cobertura. O XML vira artefato para o Sonar consumir depois.
  pytest:
    name: pytest + cobertura
    if: inputs.run-pytest
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'pytest') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      # Binários de sistema que a suíte invoca por subprocess (pdftoppm,
      # gs, ...). Sem eles o teste falha com FileNotFoundError, que é fácil
      # de confundir com arquivo de fixture faltando.
      - name: Instalar pacotes de sistema
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

      - name: Subir PostgreSQL
        if: inputs.postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=5s --health-timeout=5s --health-retries=10 \
            postgres:${{ inputs.postgres-version }}
          for _ in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL pronto"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não subiu a tempo"; docker logs ci-postgres; exit 1

      - name: Instalar dependências
        run: |
          pip install -r "${{ inputs.requirements-file }}"
          if [ -n "${{ inputs.dev-requirements-file }}" ]; then
            pip install -r "${{ inputs.dev-requirements-file }}"
          fi
          pip install pytest pytest-django pytest-cov

      - name: Exportar variáveis do projeto
        run: |
          # test-settings-module tem prioridade: a variável de ambiente vence a
          # chave DJANGO_SETTINGS_MODULE do pytest.ini na precedência do
          # pytest-django, então declarar no ini não bastaria para escapar dos
          # settings de produção.
          ALVO="${{ inputs.test-settings-module }}"
          [ -n "$ALVO" ] || ALVO="${{ inputs.django-settings-module }}"
          if [ -n "$ALVO" ]; then
            echo "DJANGO_SETTINGS_MODULE=$ALVO" >> "$GITHUB_ENV"
          fi
          # Descarta linhas vazias e comentários. O `|| true` é obrigatório:
          # com `set -e`, um grep sem correspondência (django-env vazio)
          # derrubaria o passo inteiro.
          printf '%s\n' "${{ inputs.django-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true
          # test-env vem depois de propósito: no $GITHUB_ENV a última atribuição
          # de uma chave vence, então o caller declara só as diferenças.
          printf '%s\n' "${{ inputs.test-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true

      - name: pytest
        run: |
          # Com o job de e2e ligado, a suíte comum exclui esse marcador. Sem
          # isto os testes de navegador rodariam aqui também, num ambiente sem
          # Playwright — e a falha pareceria defeito do teste, não execução
          # duplicada. Array e não string: `-m "not e2e"` tem espaço, e
          # interpolar isso numa variável dependeria de word splitting.
          MARCADOR=()
          EXPRESSAO=""
          if [ "${{ inputs.run-e2e }}" = "true" ]; then
            EXPRESSAO="not e2e"
          fi
          EXTRA="${{ inputs.pytest-markers }}"
          if [ -n "$EXTRA" ]; then
            # Parênteses: o extra pode ter `or`, e sem eles a precedência
            # mudaria o sentido de `not e2e and a or b`.
            if [ -n "$EXPRESSAO" ]; then
              EXPRESSAO="$EXPRESSAO and ($EXTRA)"
            else
              EXPRESSAO="$EXTRA"
            fi
          fi
          if [ -n "$EXPRESSAO" ]; then
            MARCADOR=(-m "$EXPRESSAO")
          fi
          pytest "${MARCADOR[@]}" \
            --cov \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ inputs.coverage-fail-under }} \
            --junitxml=junit.xml

      - name: Enviar cobertura ao Codecov
        if: inputs.run-codecov && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Guardar cobertura para o Sonar
        if: inputs.run-sonar && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
          retention-days: 1

      # Resumo no painel do job. Antes disto, saber quanto a cobertura andou
      # exigia abrir o log e procurar a tabela do pytest-cov no meio de
      # centenas de linhas — ou esperar o Codecov comentar no PR.
      #
      # A lista de módulos mais descobertos é o ponto: cobertura total é uma
      # média que esconde exatamente o que interessa, que é `services`, `tasks`
      # e as views de negócio ficarem sem teste enquanto o número global sobe.
      - name: Resumo dos testes
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, xml.etree.ElementTree as ET

          print("## Testes e cobertura\n")

          junit = pathlib.Path("junit.xml")
          if junit.is_file():
              raiz = ET.parse(junit).getroot()
              suites = [raiz] if raiz.tag == "testsuite" else list(raiz)
              def soma(chave):
                  return sum(int(s.get(chave, 0)) for s in suites)
              print(f"{soma('tests')} teste(s): {soma('failures')} falha(s), "
                    f"{soma('errors')} erro(s), {soma('skipped')} pulado(s).\n")

          cobertura = pathlib.Path("coverage.xml")
          if not cobertura.is_file():
              print("Sem relatório de cobertura.")
              raise SystemExit

          raiz = ET.parse(cobertura).getroot()
          total = float(raiz.get("line-rate", 0)) * 100
          print(f"Cobertura total: **{total:.1f}%**\n")

          modulos = []
          for classe in raiz.iter("class"):
              linhas = classe.find("lines")
              if linhas is None:
                  continue
              todas = list(linhas)
              if len(todas) < 20:
                  continue  # arquivo curto distorce o ranking sem informar nada
              modulos.append((float(classe.get("line-rate", 0)) * 100,
                              classe.get("filename", "?"), len(todas)))
          modulos.sort()
          if modulos:
              print("Módulos com menor cobertura (20+ linhas):\n")
              print("| arquivo | cobertura | linhas |")
              print("|---|---|---|")
              for taxa, arquivo, linhas in modulos[:10]:
                  print(f"| `{arquivo}` | {taxa:.0f}% | {linhas} |")
          PY

      - name: Derrubar PostgreSQL
        if: always() && inputs.postgres
        run: docker rm -f ci-postgres || true

  # 4. bandit (código) + pip-audit (dependências).
  security:
    name: bandit + pip-audit
    if: inputs.run-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Instalar ferramentas
        run: pip install "bandit[toml]" pip-audit

      # Duas passadas de propósito. A primeira imprime o relatório inteiro sem
      # derrubar o passo, para o passivo de severidade baixa e média continuar
      # à vista. A segunda é o portão: falha só a partir de bandit-severity.
      # Assim dá para travar "nenhum achado alto" sem precisar anotar dezenas
      # de pontos médios já auditados — que é o que levaria a `# nosec` cego.
      - name: bandit
        continue-on-error: ${{ contains(inputs.soft-fail, 'bandit') }}
        run: |
          # Array, e não string: o config é opcional, e uma string vazia sem
          # aspas dependeria de word splitting — que o shellcheck reprova com
          # razão. Com array vazio, nenhum argumento é passado.
          CFG=()
          if ! grep -qs "\[tool.bandit\]" pyproject.toml && [ ! -f .bandit ]; then
            CFG=(-c .ci-shared/configs/bandit.yaml)
          fi
          bandit "${CFG[@]}" -r ${{ inputs.source-paths }} --exit-zero
          # Segunda saída em JSON, para o resumo do job. É a mesma varredura,
          # não uma terceira passada: -f json apenas troca o formatador.
          bandit "${CFG[@]}" -r ${{ inputs.source-paths }} --exit-zero \
            -f json -o bandit.json || true
          echo "--- portão: falha a partir de severidade ${{ inputs.bandit-severity }} ---"
          bandit "${CFG[@]}" -r ${{ inputs.source-paths }} \
            --severity-level ${{ inputs.bandit-severity }} -q

      # Audita o ambiente instalado, e não só o arquivo, para pegar também as
      # dependências transitivas resolvidas de fato.
      - name: pip-audit
        continue-on-error: ${{ contains(inputs.soft-fail, 'pip-audit') }}
        run: |
          pip install -r "${{ inputs.requirements-file }}"
          if [ -n "${{ inputs.dev-requirements-file }}" ]; then
            pip install -r "${{ inputs.dev-requirements-file }}"
          fi
          pip-audit --progress-spinner off --format json --output pip-audit.json || true
          pip-audit --progress-spinner off

      # A severidade entra por variável de ambiente, e não interpolada no corpo
      # do script: `${{ }}` é substituído como texto antes de o shell ver a
      # linha, então um valor com aspas viraria erro de sintaxe do Python a
      # dezenas de linhas do lugar onde se olharia primeiro.
      - name: Resumo de segurança
        if: always()
        env:
          BANDIT_SEVERITY: ${{ inputs.bandit-severity }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          from collections import Counter

          print("## Segurança\n")

          bandit = pathlib.Path("bandit.json")
          if bandit.is_file():
              dados = json.loads(bandit.read_text(encoding="utf-8"))
              achados = dados.get("results", [])
              por_nivel = Counter(a.get("issue_severity", "?") for a in achados)
              print(f"bandit: {len(achados)} achado(s) — "
                    + ", ".join(f"{n}: {q}" for n, q in sorted(por_nivel.items()))
                    + f". Portão em `{os.environ.get('BANDIT_SEVERITY', '?')}`.\n")
              altos = [a for a in achados if a.get("issue_severity") == "HIGH"]
              if altos:
                  print("| arquivo | linha | teste |")
                  print("|---|---|---|")
                  for a in altos[:10]:
                      print(f"| `{a.get('filename')}` | {a.get('line_number')} "
                            f"| {a.get('test_id')} {a.get('issue_text', '')[:60]} |")
                  print()

          auditoria = pathlib.Path("pip-audit.json")
          if auditoria.is_file():
              try:
                  dados = json.loads(auditoria.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  dados = {}
              deps = dados.get("dependencies", dados if isinstance(dados, list) else [])
              vulneraveis = [d for d in deps if d.get("vulns")]
              print(f"pip-audit: {len(vulneraveis)} dependência(s) com vulnerabilidade "
                    f"conhecida, de {len(deps)} auditada(s).\n")
              for d in vulneraveis[:10]:
                  ids = ", ".join(v.get("id", "?") for v in d["vulns"])
                  print(f"- `{d.get('name')}` {d.get('version')} — {ids}")
          PY

  # 5. gitleaks — segredos no diff e no histórico.
  gitleaks:
    name: gitleaks (segredos)
    if: inputs.run-gitleaks
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'gitleaks') }}
    steps:
      # Histórico completo: um segredo removido no último commit continua
      # exposto nos commits anteriores.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Escanear histórico
        run: |
          CFG=".gitleaks.toml"
          [ -f "$CFG" ] || CFG=".ci-shared/configs/gitleaks.toml"
          gitleaks git . \
            --config "$CFG" \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7
          if-no-files-found: ignore

  # 7. Checagens específicas do Django.
  django:
    name: django check --deploy + migrações
    if: inputs.run-django-checks
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'django') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Instalar dependências
        run: pip install -r "${{ inputs.requirements-file }}"

      - name: Exportar variáveis do projeto
        run: |
          if [ -n "${{ inputs.django-settings-module }}" ]; then
            echo "DJANGO_SETTINGS_MODULE=${{ inputs.django-settings-module }}" >> "$GITHUB_ENV"
          fi
          # Descarta linhas vazias e comentários. O `|| true` é obrigatório:
          # com `set -e`, um grep sem correspondência (django-env vazio)
          # derrubaria o passo inteiro.
          printf '%s\n' "${{ inputs.django-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true

      - name: Nenhuma migração faltando
        run: python manage.py makemigrations --check --dry-run

      - name: check --deploy
        run: python manage.py check --deploy --fail-level ${{ inputs.django-check-fail-level }}

  # 8. Licenças das dependências. O veredito é do liccheck; o inventário em
  # Markdown é subproduto e serve para manter o LICENCAS.md do projeto sem
  # transcrever tabela à mão.
  licencas:
    name: licenças (liccheck)
    if: inputs.run-licencas
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'licencas') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      # Ambiente separado do Python do runner, e não `pip install` direto: é o
      # que permite gerar um inventário que contém só o que o projeto embarca.
      # Instaladas juntas, as próprias ferramentas do CI apareceriam na tabela
      # como se fossem dependência do produto.
      - name: Instalar dependências num ambiente isolado
        run: |
          python -m venv "$RUNNER_TEMP/projeto"
          "$RUNNER_TEMP/projeto/bin/pip" install -q -r "${{ inputs.requirements-file }}"
          if [ -n "${{ inputs.dev-requirements-file }}" ]; then
            "$RUNNER_TEMP/projeto/bin/pip" install -q -r "${{ inputs.dev-requirements-file }}"
          fi

      # A ordem importa: o inventário sai ANTES de o liccheck entrar no venv.
      # Invertido, ele e as dependências dele constariam da tabela publicada.
      - name: Inventário de licenças
        run: |
          pip install -q pip-licenses
          pip-licenses --python "$RUNNER_TEMP/projeto/bin/python" \
            --format=markdown --with-authors --with-urls --order=license \
            > licencas-inventario.md
          cat licencas-inventario.md

      # `setuptools<81` não é capricho: o liccheck 0.9.2 importa pkg_resources,
      # que o setuptools 81 removeu. Sem o pino o job morre no import, com um
      # ModuleNotFoundError que não menciona o liccheck.
      - name: liccheck
        run: |
          CFG="liccheck.ini"
          [ -f "$CFG" ] || CFG=".ci-shared/configs/liccheck.ini"
          echo "política: $CFG (nível ${{ inputs.liccheck-level }})"
          "$RUNNER_TEMP/projeto/bin/pip" install -q liccheck "setuptools<81"
          "$RUNNER_TEMP/projeto/bin/liccheck" \
            -s "$CFG" \
            -r "${{ inputs.requirements-file }}" \
            -l "${{ inputs.liccheck-level }}"

      # O inventário já é gerado em markdown; jogá-lo no painel do job poupa
      # baixar o artefato só para responder "que licenças entraram com este PR?".
      - name: Resumo de licenças
        if: always()
        run: |
          if [ -f licencas-inventario.md ]; then
            {
              echo "## Licenças das dependências"
              echo
              echo "<details><summary>Inventário completo</summary>"
              echo
              cat licencas-inventario.md
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar inventário
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licencas
          path: licencas-inventario.md
          retention-days: 30
          if-no-files-found: ignore

  # 9. SBOM. Descreve o que o projeto de fato embarca, com as transitivas já
  # resolvidas — é o documento que responde, meses depois, se uma CVE recém-
  # publicada alcançava a versão que estava no ar naquele commit.
  sbom:
    name: SBOM (CycloneDX)
    if: inputs.run-sbom
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'sbom') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      # Só as dependências de runtime: o SBOM descreve o que vai para produção.
      # Incluir pytest e ruff aqui produziria um inventário que não corresponde
      # a nenhuma máquina real.
      - name: Instalar dependências de runtime num ambiente isolado
        run: |
          python -m venv "$RUNNER_TEMP/projeto"
          "$RUNNER_TEMP/projeto/bin/pip" install -q -r "${{ inputs.requirements-file }}"

      # `environment` e não `requirements`: o segundo descreve o que o arquivo
      # pede, o primeiro descreve o que o pip resolveu — que é o que roda.
      # `--output-reproducible` remove o carimbo de data, para que dois builds
      # do mesmo commit gerem SBOMs idênticos e o diff signifique alguma coisa.
      - name: Gerar SBOM
        run: |
          pip install -q cyclonedx-bom
          cyclonedx-py environment "$RUNNER_TEMP/projeto/bin/python" \
            --sv "${{ inputs.sbom-spec-version }}" \
            --of JSON \
            --output-reproducible \
            -o sbom.cdx.json

      - name: Resumo
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, pathlib
          bom = json.loads(pathlib.Path("sbom.cdx.json").read_text())
          comps = bom.get("components", [])
          print("## SBOM\n")
          print(f"{len(comps)} componentes (CycloneDX {bom.get('specVersion')}).\n")
          licencas = collections.Counter()
          for c in comps:
              for lic in c.get("licenses") or [{}]:
                  item = lic.get("license") or {}
                  licencas[item.get("id") or item.get("name") or lic.get("expression") or "não declarada"] += 1
          print("| licença | componentes |")
          print("|---|---|")
          for nome, n in licencas.most_common():
              print(f"| {nome} | {n} |")
          PY

      - name: Guardar SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: ${{ inputs.sbom-retention-days }}
          if-no-files-found: ignore

  # 10. Dependências travadas por hash. Duas checagens distintas: que o lock
  # corresponde ao requirements.txt, e que ele instala de verdade sob
  # --require-hashes. A segunda é a que pega transitiva faltando — falha que
  # não aparece em nenhuma outra etapa, porque as demais instalam pelo
  # requirements.txt, com o resolvedor livre.
  lock:
    name: lock com hashes
    if: inputs.run-lock
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'lock') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      # O lock é resolvido para o Python de produção, que pode não ser o das
      # outras etapas — a imagem do sistema_arq roda 3.14 enquanto o pipeline
      # analisa em 3.12. Conferir a instalação na versão errada acusaria
      # divergência que não existe.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.lock-python-version != '' && inputs.lock-python-version || inputs.python-version }}

      - name: Lock confere com o requirements
        run: |
          python .ci-shared/scripts/conferir_lock.py \
            --requirements "${{ inputs.requirements-file }}" \
            --lock "${{ inputs.lock-file }}"

      - name: Instalar com --require-hashes
        run: |
          python -m venv "$RUNNER_TEMP/lock"
          "$RUNNER_TEMP/lock/bin/pip" install \
            --require-hashes -r "${{ inputs.lock-file }}"
          echo "--- instalado a partir do lock ---"
          "$RUNNER_TEMP/lock/bin/pip" list

  # 11. Testes de ponta a ponta num navegador de verdade.
  e2e:
    name: e2e (Playwright)
    if: inputs.run-e2e
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'e2e') }}
    # Rede travada num download (espelho de apt, registry do npm, CDN do
    # Playwright) já segurou um runner por vinte minutos sem uma linha de erro
    # no log. Com o limite, o job reprova rápido em vez de ficar pendurado.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Instalar pacotes de sistema
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

      - name: Subir PostgreSQL
        if: inputs.postgres
        run: |
          docker run -d --name ci-postgres-e2e \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:${{ inputs.postgres-version }}
          for _ in $(seq 1 30); do
            if docker exec ci-postgres-e2e pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL pronto"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não subiu a tempo"; docker logs ci-postgres-e2e; exit 1

      - name: Instalar dependências
        run: |
          pip install -r "${{ inputs.requirements-file }}"
          if [ -n "${{ inputs.dev-requirements-file }}" ]; then
            pip install -r "${{ inputs.dev-requirements-file }}"
          fi
          pip install pytest pytest-django pytest-playwright

      # Sem `--with-deps`: a imagem do ubuntu-latest já traz as bibliotecas de
      # sistema que o navegador precisa, e o `apt-get update` que a flag
      # dispara é o único ponto destes jobs que depende de espelho externo.
      # Espelho da Azure fora do ar travou este passo por vinte minutos em três
      # execuções seguidas, sem nenhum erro no log. Se um dia o runner mudar e
      # faltar um .so, o sintoma é o navegador não abrir — aí a flag volta, com
      # `timeout-minutes` limitando o estrago.
      - name: Instalar navegador
        run: playwright install ${{ inputs.e2e-browser }}

      - name: Exportar variáveis do projeto
        run: |
          ALVO="${{ inputs.test-settings-module }}"
          [ -n "$ALVO" ] || ALVO="${{ inputs.django-settings-module }}"
          if [ -n "$ALVO" ]; then
            echo "DJANGO_SETTINGS_MODULE=$ALVO" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "${{ inputs.django-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true
          printf '%s\n' "${{ inputs.test-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true

      # DJANGO_ALLOW_ASYNC_UNSAFE é obrigatório para a combinação
      # live_server + Playwright, e o erro sem ele não indica nenhum dos dois:
      # a suíte morre em `SynchronousOnlyOperation: You cannot call this from
      # an async context` durante a criação do banco de teste.
      #
      # A causa é que a API síncrona do Playwright deixa um event loop montado
      # na thread, e o Django recusa qualquer operação síncrona de banco na
      # presença dele. Aqui a proteção não protege de nada: as chamadas ao
      # banco continuam na mesma thread, e o loop é só o driver do navegador.
      # Fora de teste, essa variável não deve ser usada.
      - name: pytest (e2e)
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "1"
        run: |
          # shellcheck disable=SC2086
          pytest ${{ inputs.e2e-args }} --junitxml=junit-e2e.xml

      # Rastro do Playwright quando algo quebra: sem isto, teste de navegador
      # que falha só no CI vira depuração às cegas.
      - name: Guardar rastro da falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-rastro
          path: |
            test-results/
            junit-e2e.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Derrubar PostgreSQL
        if: always() && inputs.postgres
        run: docker rm -f ci-postgres-e2e || true

  # 12. Acessibilidade. Roda sobre o servidor de desenvolvimento, com os
  # settings de teste: sob os de produção o SECURE_SSL_REDIRECT devolveria 301
  # em toda página e o axe auditaria uma tela de redirecionamento vazia.
  a11y:
    name: acessibilidade (axe-core)
    if: inputs.run-a11y
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'a11y') }}
    # Rede travada num download (espelho de apt, registry do npm, CDN do
    # Playwright) já segurou um runner por vinte minutos sem uma linha de erro
    # no log. Com o limite, o job reprova rápido em vez de ficar pendurado.
    timeout-minutes: 20
    env:
      AXE_VERSION: "4.11.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Conferir que há o que auditar
        run: |
          if ! printf '%s\n' "${{ inputs.a11y-paths }}" | grep -qE '[^[:space:]]'; then
            echo "::error::run-a11y está ligado mas a11y-paths está vazio." >&2
            exit 1
          fi

      - name: Instalar pacotes de sistema
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

      - name: Subir PostgreSQL
        if: inputs.postgres
        run: |
          docker run -d --name ci-postgres-a11y \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:${{ inputs.postgres-version }}
          for _ in $(seq 1 30); do
            if docker exec ci-postgres-a11y pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL pronto"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não subiu a tempo"; docker logs ci-postgres-a11y; exit 1

      - name: Instalar dependências
        run: |
          pip install -r "${{ inputs.requirements-file }}"
          pip install playwright
          playwright install chromium

      # O axe-core vem do npm e não de CDN: versão fixada, baixada uma vez, e
      # o arquivo é injetado pelo protocolo do navegador — não como <script>,
      # que a Content-Security-Policy do projeto barraria.
      - name: Baixar axe-core
        run: npm install --no-save --no-audit --no-fund "axe-core@${AXE_VERSION}"

      - name: Exportar variáveis do projeto
        run: |
          ALVO="${{ inputs.test-settings-module }}"
          [ -n "$ALVO" ] || ALVO="${{ inputs.django-settings-module }}"
          if [ -n "$ALVO" ]; then
            echo "DJANGO_SETTINGS_MODULE=$ALVO" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "${{ inputs.django-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true
          printf '%s\n' "${{ inputs.test-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true

      # O comando de semeadura entra numa variável antes do teste, e não
      # direto no corpo do `if`. Interpolado no corpo, um input vazio deixa o
      # bloco `then` sem nenhum comando — e `if ...; then fi` é erro de
      # sintaxe no bash, não bloco vazio. O passo morria com
      # "syntax error near unexpected token `fi'" depois de o migrate já ter
      # rodado, o que aponta para o lugar errado.
      - name: Preparar o banco
        run: |
          SETUP="${{ inputs.a11y-setup-command }}"
          python manage.py migrate --noinput
          if [ -n "$SETUP" ]; then
            echo "semeando dados: $SETUP"
            bash -c "$SETUP"
          fi

      # collectstatic para o caso de storage com manifesto: sem o manifesto o
      # {% static %} levanta exceção e a página nem renderiza. Falha aqui não
      # derruba o job — vira aviso, porque o veredito de acessibilidade é
      # sobre o HTML, e um projeto sem manifesto não precisa deste passo.
      - name: Coletar estáticos
        run: |
          if ! python manage.py collectstatic --noinput --verbosity 0; then
            echo "::warning::collectstatic falhou; a auditoria segue sem os estáticos coletados."
          fi

      # `--insecure` obriga o runserver a servir os estáticos mesmo com
      # DEBUG=False. Sem isso o CSS não carrega e as regras de contraste do axe
      # avaliam uma página sem estilo — resultado que não corresponde a nada.
      - name: Subir o servidor
        run: |
          PORTA="${{ inputs.a11y-port }}"
          python manage.py runserver "127.0.0.1:$PORTA" --noreload --insecure \
            > "$RUNNER_TEMP/servidor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/servidor.pid"
          for _ in $(seq 1 30); do
            # Sem -f de propósito: 404 ou 302 já provam que o servidor responde,
            # e a raiz do projeto pode legitimamente não ser 200.
            if curl -s -o /dev/null "http://127.0.0.1:$PORTA/"; then
              echo "servidor no ar"; exit 0
            fi
            sleep 1
          done
          echo "::error::o servidor não subiu em 30s"; cat "$RUNNER_TEMP/servidor.log"; exit 1

      - name: axe-core
        run: |
          printf '%s\n' "${{ inputs.a11y-paths }}" \
            | tr -d '\r' \
            | grep -vE '^[[:space:]]*(#.*)?$' > "$RUNNER_TEMP/paths.txt" || true
          ARGS=()
          while IFS= read -r caminho; do
            [ -n "$caminho" ] || continue
            ARGS+=(--paths "$caminho")
          done < "$RUNNER_TEMP/paths.txt"
          python .ci-shared/scripts/a11y.py \
            --base-url "http://127.0.0.1:${{ inputs.a11y-port }}" \
            --axe node_modules/axe-core/axe.min.js \
            --tags "${{ inputs.a11y-tags }}" \
            --fail-on "${{ inputs.a11y-fail-on }}" \
            --out a11y.json \
            "${ARGS[@]}"

      # O a11y.json já era publicado como artefato, mas ler o passivo exigia
      # baixar o zip. O resumo põe a contagem por impacto no painel do job, que
      # é o número que o RUNBOOK 5.3 manda medir antes de apertar o gate.
      - name: Resumo de acessibilidade
        if: always()
        env:
          A11Y_FAIL_ON: ${{ inputs.a11y-fail-on }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          from collections import Counter

          print("## Acessibilidade (axe-core)\n")
          arquivo = pathlib.Path("a11y.json")
          if not arquivo.is_file():
              print("A auditoria não gerou relatório.")
              raise SystemExit

          relatorio = json.loads(arquivo.read_text(encoding="utf-8"))
          impactos = Counter()
          regras = Counter()
          for violacoes in relatorio.values():
              for v in violacoes:
                  impactos[v.get("impact") or "minor"] += 1
                  regras[v["id"]] += 1

          total = sum(impactos.values())
          print(f"{total} violação(ões) em {len(relatorio)} página(s). "
                f"Reprovação em `{os.environ.get('A11Y_FAIL_ON', '?')}`.\n")
          if impactos:
              print("| impacto | ocorrências |")
              print("|---|---|")
              for nivel in ("critical", "serious", "moderate", "minor"):
                  if impactos[nivel]:
                      print(f"| {nivel} | {impactos[nivel]} |")
              print()
              print("Regras mais frequentes: " + ", ".join(
                  f"`{regra}` ({quantas})" for regra, quantas in regras.most_common(5)))
          PY

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y
          path: |
            a11y.json
            ${{ runner.temp }}/servidor.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Derrubar o servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/servidor.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/servidor.pid")" || true
          fi
          if [ "${{ inputs.postgres }}" = "true" ]; then
            docker rm -f ci-postgres-a11y || true
          fi

  # 13. Qualidade do diff. É a etapa que responde "esta alteração aumentou a
  # dívida?", que é a pergunta que faz sentido num repositório com anos de
  # remendo — "este repositório está limpo?" já se sabe que não.
  #
  # Só roda em pull_request: num push para a main não existe base contra a qual
  # medir o que é novo, e comparar com o commit anterior transformaria cada
  # merge numa auditoria do próprio merge.
  diff-quality:
    name: qualidade do diff
    if: inputs.run-diff-quality && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'diff') }}
    steps:
      # fetch-depth: 0 é obrigatório. Com o checkout raso o merge-base não
      # existe no clone, e `git diff base...HEAD` falha com erro de revisão
      # desconhecida — que não se parece nem um pouco com a causa real.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # Sem dependências: o script usa só a biblioteca padrão e o git. É de
      # propósito — a etapa que julga o diff não deveria ser a que quebra por
      # conflito de versão de pacote.
      - name: Analisar as linhas novas
        run: |
          python .ci-shared/scripts/diff_quality.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --fail-on "${{ inputs.diff-quality-fail-on }}" \
            --limite-funcao "${{ inputs.diff-quality-limite-funcao }}" \
            --limite-crescimento "${{ inputs.diff-quality-limite-crescimento }}" \
            --out diff-quality.json

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diff-quality
          path: diff-quality.json
          retention-days: 30
          if-no-files-found: ignore

  # 14. Qualidade estática de frontend: CSS, JavaScript e templates.
  #
  # As três versões são pinadas pelo mesmo motivo do axe-core e do gitleaks: uma
  # regra nova numa versão futura entraria reprovando nove repositórios de uma
  # vez, sem ninguém ter mudado uma linha de código.
  frontend:
    name: frontend (CSS, JS, templates)
    if: inputs.run-frontend
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'frontend') }}
    timeout-minutes: 15
    env:
      STYLELINT_VERSION: "16.26.1"
      ESLINT_VERSION: "9.39.5"
      GLOBALS_VERSION: "17.12.0"
      DJLINT_VERSION: "1.46.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # Os três pacotes numa chamada só. Com `--no-save`, cada `npm install`
      # seguinte reescreve a árvore a partir do package.json — que não existe —
      # e apaga o que o anterior instalou. Instalados em chamadas separadas, o
      # eslint some quando o globals entra, e o job falha dizendo que o binário
      # não existe.
      - name: Instalar ferramentas
        run: |
          # --ignore-scripts: nenhuma das três ferramentas precisa de script de
          # ciclo de vida, e sem a flag um pacote comprometido na árvore de
          # dependências executaria código durante a instalação, dentro de um
          # runner que tem o checkout do projeto em mãos.
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            "stylelint@${STYLELINT_VERSION}" \
            "eslint@${ESLINT_VERSION}" \
            "globals@${GLOBALS_VERSION}"
          # --only-binary :all: pelo mesmo motivo: instalar de sdist roda o
          # setup.py do pacote. Conferido que djlint e playwright resolvem a
          # árvore inteira só com wheels.
          pip install --only-binary :all: "djlint==${DJLINT_VERSION}"

      # Mesma convenção do ruff: config do projeto vence, config compartilhada
      # como padrão. Um projeto que precise divergir não fica refém do repo do CI.
      - name: Selecionar configurações
        run: |
          if [ -f .stylelintrc.json ] || [ -f .stylelintrc ] || [ -f stylelint.config.js ]; then
            echo "CONFIG_STYLELINT=" >> "$GITHUB_ENV"
            echo "Usando a configuração de Stylelint do projeto."
          else
            echo "CONFIG_STYLELINT=--config .ci-shared/configs/stylelint.json" >> "$GITHUB_ENV"
          fi
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            echo "CONFIG_ESLINT=" >> "$GITHUB_ENV"
            echo "Usando a configuração de ESLint do projeto."
          else
            echo "CONFIG_ESLINT=--config .ci-shared/configs/eslint.config.mjs --no-config-lookup" >> "$GITHUB_ENV"
          fi

      # `--output-file` e não redirecionamento: o Stylelint escreve o relatório
      # em stderr quando encontra alguma coisa, então `2>/dev/null` apagaria
      # exatamente o caso que interessa e devolveria silêncio — que parece
      # sucesso. Levou uma tarde para descobrir.
      #
      # Os globs saem de `frontend-paths` e nunca da raiz: `**/*.css` a partir
      # do topo do repositório varre `venv/` inteiro e o passo trava sem
      # mensagem nenhuma até estourar o timeout.
      - name: Stylelint
        if: inputs.run-stylelint
        continue-on-error: true
        run: |
          ALVOS=()
          for dir in ${{ inputs.frontend-paths }}; do
            [ -d "$dir" ] && ALVOS+=("$dir/**/*.css")
          done
          if [ ${#ALVOS[@]} -eq 0 ]; then
            echo "::warning::nenhum diretório de frontend encontrado; pulando o CSS."
            echo "[]" > stylelint.json
            exit 0
          fi
          # shellcheck disable=SC2086
          npx --no-install stylelint "${ALVOS[@]}" $CONFIG_STYLELINT \
            --ignore-pattern "**/*.min.css" \
            --formatter json --output-file stylelint.json || true
          [ -f stylelint.json ] || echo "[]" > stylelint.json

      - name: ESLint
        if: inputs.run-eslint
        continue-on-error: true
        run: |
          ALVOS=()
          for dir in ${{ inputs.frontend-paths }}; do
            [ -d "$dir" ] && ALVOS+=("$dir")
          done
          if [ ${#ALVOS[@]} -eq 0 ]; then
            echo "::warning::nenhum diretório de frontend encontrado; pulando o JavaScript."
            echo "[]" > eslint.json
            exit 0
          fi
          # shellcheck disable=SC2086
          npx --no-install eslint "${ALVOS[@]}" $CONFIG_ESLINT \
            --format json -o eslint.json || true
          [ -f eslint.json ] || echo "[]" > eslint.json

      - name: djlint
        if: inputs.run-djlint
        continue-on-error: true
        run: |
          ALVOS=()
          for dir in ${{ inputs.template-paths }}; do
            [ -d "$dir" ] && ALVOS+=("$dir")
          done
          if [ ${#ALVOS[@]} -eq 0 ]; then
            echo "::warning::nenhum diretório de template encontrado."
            : > djlint.txt
            exit 0
          fi
          CONFIG=".ci-shared/configs/djlint.toml"
          if grep -q "\[tool.djlint\]" pyproject.toml 2>/dev/null || [ -f .djlintrc ]; then
            echo "Usando a configuração de djlint do projeto."
            djlint "${ALVOS[@]}" --lint > djlint.txt 2>&1 || true
          else
            djlint "${ALVOS[@]}" --configuration "$CONFIG" --prefer-configuration \
              --lint > djlint.txt 2>&1 || true
          fi
          cat djlint.txt

      # As três etapas acima usam continue-on-error porque o veredito é deste
      # passo: cada binário sai com código diferente para "encontrei algo", e
      # somá-los no shell perderia a distinção entre achado e falha de execução.
      - name: Consolidar
        run: |
          ARGS=()
          [ -f stylelint.json ] && ARGS+=(--stylelint stylelint.json)
          [ -f eslint.json ] && ARGS+=(--eslint eslint.json)
          [ -f djlint.txt ] && ARGS+=(--djlint djlint.txt)
          for dir in ${{ inputs.template-paths }}; do
            ARGS+=(--djlint-raiz "$dir")
          done
          python .ci-shared/scripts/frontend_relatorio.py "${ARGS[@]}" \
            --fail-on "${{ inputs.frontend-fail-on }}" \
            --out frontend.json

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: |
            frontend.json
            stylelint.json
            eslint.json
            djlint.txt
          retention-days: 30
          if-no-files-found: ignore

  # 15. Layout renderizado. Mesma montagem do job de acessibilidade — servidor de
  # desenvolvimento sob os settings de teste — porque as duas perguntas só têm
  # resposta com a página de pé num navegador de verdade.
  layout:
    name: layout (Playwright)
    if: inputs.run-layout
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'layout') }}
    timeout-minutes: 20
    env:
      # Pinado como o axe-core e o gitleaks. A medição de layout compara
      # números de renderização: uma versão nova do Chromium que arredonde
      # diferente muda o resultado sem ninguém ter tocado no CSS.
      PLAYWRIGHT_VERSION: "1.62.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || github.job_workflow_sha }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Conferir que há o que medir
        run: |
          if ! printf '%s\n' "${{ inputs.layout-paths }}" | grep -qE '[^[:space:]]'; then
            echo "::error::run-layout está ligado mas layout-paths está vazio." >&2
            exit 1
          fi

      - name: Instalar pacotes de sistema
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

      - name: Subir PostgreSQL
        if: inputs.postgres
        run: |
          docker run -d --name ci-postgres-layout \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:${{ inputs.postgres-version }}
          for _ in $(seq 1 30); do
            if docker exec ci-postgres-layout pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL pronto"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não subiu a tempo"; docker logs ci-postgres-layout; exit 1

      - name: Instalar dependências
        run: |
          pip install -r "${{ inputs.requirements-file }}"
          # --only-binary :all: pelo mesmo motivo: instalar de sdist roda o
          # setup.py do pacote. Conferido que djlint e playwright resolvem a
          # árvore inteira só com wheels.
          pip install --only-binary :all: "playwright==${PLAYWRIGHT_VERSION}"
          playwright install chromium

      - name: Exportar variáveis do projeto
        run: |
          ALVO="${{ inputs.test-settings-module }}"
          [ -n "$ALVO" ] || ALVO="${{ inputs.django-settings-module }}"
          if [ -n "$ALVO" ]; then
            echo "DJANGO_SETTINGS_MODULE=$ALVO" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "${{ inputs.django-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true
          printf '%s\n' "${{ inputs.test-env }}" \
            | grep -vE '^[[:space:]]*(#.*)?$' >> "$GITHUB_ENV" || true

      # O comando de semeadura entra numa variável antes do teste pelo mesmo
      # motivo do job de a11y: interpolado no corpo do `if`, um input vazio
      # deixa o bloco `then` sem comando nenhum, e `if ...; then fi` é erro de
      # sintaxe no bash.
      - name: Preparar o banco
        run: |
          SETUP="${{ inputs.layout-setup-command }}"
          python manage.py migrate --noinput
          if [ -n "$SETUP" ]; then
            echo "semeando dados: $SETUP"
            bash -c "$SETUP"
          fi

      # Aqui o collectstatic importa mais que no a11y: sem os estáticos, a
      # página renderiza sem CSS, e medir largura de elemento sem folha de
      # estilo não mede nada. Falhar aqui é falhar a medição inteira.
      - name: Coletar estáticos
        run: python manage.py collectstatic --noinput --verbosity 0

      - name: Subir o servidor
        run: |
          PORTA="${{ inputs.layout-port }}"
          python manage.py runserver "127.0.0.1:$PORTA" --noreload --insecure \
            > "$RUNNER_TEMP/servidor-layout.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/servidor-layout.pid"
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "http://127.0.0.1:$PORTA/"; then
              echo "servidor no ar"; exit 0
            fi
            sleep 1
          done
          echo "::error::o servidor não subiu em 30s"
          cat "$RUNNER_TEMP/servidor-layout.log"; exit 1

      - name: Medir o layout
        run: |
          printf '%s\n' "${{ inputs.layout-paths }}" \
            | tr -d '\r' \
            | grep -vE '^[[:space:]]*(#.*)?$' > "$RUNNER_TEMP/layout-paths.txt" || true
          ARGS=()
          while IFS= read -r caminho; do
            [ -n "$caminho" ] || continue
            ARGS+=(--paths "$caminho")
          done < "$RUNNER_TEMP/layout-paths.txt"
          python .ci-shared/scripts/layout.py \
            --base-url "http://127.0.0.1:${{ inputs.layout-port }}" \
            --larguras "${{ inputs.layout-larguras }}" \
            --alvo-minimo "${{ inputs.layout-alvo-minimo }}" \
            --fail-on "${{ inputs.layout-fail-on }}" \
            --out layout.json \
            "${ARGS[@]}"

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout
          path: |
            layout.json
            ${{ runner.temp }}/servidor-layout.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Derrubar o servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/servidor-layout.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/servidor-layout.pid")" || true
          fi
          if [ "${{ inputs.postgres }}" = "true" ]; then
            docker rm -f ci-postgres-layout || true
          fi

  # 6. Sonar por último: agrega a cobertura gerada pelo job de testes.
  sonar:
    name: SonarQube Cloud
    if: inputs.run-sonar && !cancelled()
    needs: [pytest]
    runs-on: ubuntu-latest
    steps:
      # O Sonar usa o blame do git para atribuir "código novo" — precisa do
      # histórico inteiro, senão toda linha vira responsabilidade do último commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Baixar cobertura
        uses: actions/download-artifact@v7
        with:
          name: coverage
        continue-on-error: true

      # Sem as duas chaves o scanner morre com erro genérico de projeto não
      # encontrado. Falhar aqui diz o que está faltando.
      - name: Conferir identificação do projeto
        run: |
          faltou=""
          [ -n "${{ inputs.sonar-project-key }}" ] || faltou="sonar-project-key"
          [ -n "${{ inputs.sonar-organization }}" ] || faltou="$faltou sonar-organization"
          if [ -n "$faltou" ]; then
            echo "run-sonar está ligado mas falta informar:$faltou" >&2
            exit 1
          fi

      # SONAR_HOST_URL não é declarado de propósito: o action assume o
      # SonarQube Cloud quando a variável está ausente. Declarar apontando para
      # outro lugar é o que quebra.
      #
      # sonar.sources fica no padrão (raiz do repositório) em vez de reusar
      # source-paths: o input é separado por espaço e o Sonar quer vírgula, e
      # analisar a raiz ainda pega templates, CSS e JS — que nestes projetos
      # carregam lógica de verdade.
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.organization=${{ inputs.sonar-organization }}
            -Dsonar.python.version=${{ inputs.python-version }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/migrations/**,**/staticfiles/**,**/node_modules/**,**/venv/**,**/.venv/**,**/*.jpg,**/*.jpeg,**/*.png,**/*.gif,**/*.ico,**/*.webp,**/*.pdf,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot
            -Dsonar.coverage.exclusions=**/migrations/**,**/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,**/conftest.py,**/settings/**,**/manage.py,**/wsgi.py,**/asgi.py
            ${{ inputs.sonar-args }}

  # Portão único: é este job que o branch protection deve exigir.
  resultado:
    name: CI
    if: always()
    needs: [ruff, mypy, pytest, security, gitleaks, django, sonar, licencas, sbom, lock, e2e, a11y,
            diff-quality, frontend, layout]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar
        env:
          SOFT_FAIL: ${{ inputs.soft-fail }}
          R_RUFF: ${{ needs.ruff.result }}
          R_MYPY: ${{ needs.mypy.result }}
          R_PYTEST: ${{ needs.pytest.result }}
          R_SECURITY: ${{ needs.security.result }}
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_DJANGO: ${{ needs.django.result }}
          R_SONAR: ${{ needs.sonar.result }}
          R_LICENCAS: ${{ needs.licencas.result }}
          R_SBOM: ${{ needs.sbom.result }}
          R_LOCK: ${{ needs.lock.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_A11Y: ${{ needs.a11y.result }}
          R_DIFF: ${{ needs.diff-quality.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
          R_LAYOUT: ${{ needs.layout.result }}
        run: |
          falhou=0
          # `skipped` é resultado válido: a etapa foi desligada por input.
          # Etapas listadas em soft-fail reportam mas não derrubam o build —
          # a checagem é feita aqui, e não só via continue-on-error, para não
          # depender de como o Actions propaga o resultado de um job tolerante.
          verificar() {
            nome="$1"; resultado="$2"
            printf '%-10s %s' "$nome" "$resultado"
            case "$resultado" in
              success|skipped) echo "" ;;
              *)
                if printf '%s' ",$SOFT_FAIL," | tr -d ' ' | grep -q ",$nome,"; then
                  echo "  (soft-fail: não bloqueia)"
                else
                  echo "  <-- BLOQUEIA"
                  falhou=1
                fi
                ;;
            esac
          }
          verificar ruff      "$R_RUFF"
          verificar mypy      "$R_MYPY"
          verificar pytest    "$R_PYTEST"
          # O job de segurança já aplica soft-fail por passo (bandit/pip-audit
          # separadamente), então uma falha que chega aqui é sempre bloqueante.
          verificar security  "$R_SECURITY"
          verificar gitleaks  "$R_GITLEAKS"
          verificar django    "$R_DJANGO"
          verificar sonar     "$R_SONAR"
          verificar licencas  "$R_LICENCAS"
          verificar sbom      "$R_SBOM"
          verificar lock      "$R_LOCK"
          verificar e2e       "$R_E2E"
          verificar a11y      "$R_A11Y"
          verificar diff      "$R_DIFF"
          verificar frontend  "$R_FRONTEND"
          verificar layout    "$R_LAYOUT"
          if [ "$falhou" -ne 0 ]; then
            echo "::error::Alguma etapa obrigatória do CI falhou."
            exit 1
          fi
          echo "Todas as etapas obrigatórias passaram."

      # A tabela do portão é o resumo que se lê primeiro: diz de uma vez o que
      # rodou, o que foi pulado por input e o que está tolerado por soft-fail.
      # `if: always()` porque é justamente quando alguma coisa falha que ela
      # precisa aparecer.
      - name: Resumo do portão
        if: always()
        env:
          SOFT_FAIL: ${{ inputs.soft-fail }}
          R_RUFF: ${{ needs.ruff.result }}
          R_MYPY: ${{ needs.mypy.result }}
          R_PYTEST: ${{ needs.pytest.result }}
          R_SECURITY: ${{ needs.security.result }}
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_DJANGO: ${{ needs.django.result }}
          R_SONAR: ${{ needs.sonar.result }}
          R_LICENCAS: ${{ needs.licencas.result }}
          R_SBOM: ${{ needs.sbom.result }}
          R_LOCK: ${{ needs.lock.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_A11Y: ${{ needs.a11y.result }}
          R_DIFF: ${{ needs.diff-quality.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
          R_LAYOUT: ${{ needs.layout.result }}
        run: |
          {
            echo "## Portão do CI"
            echo
            echo "| etapa | resultado | observação |"
            echo "|---|---|---|"
            for par in \
              "ruff:$R_RUFF" "mypy:$R_MYPY" "pytest:$R_PYTEST" "security:$R_SECURITY" \
              "gitleaks:$R_GITLEAKS" "django:$R_DJANGO" "sonar:$R_SONAR" \
              "licencas:$R_LICENCAS" "sbom:$R_SBOM" "lock:$R_LOCK" "e2e:$R_E2E" \
              "a11y:$R_A11Y" "diff:$R_DIFF" "frontend:$R_FRONTEND" "layout:$R_LAYOUT"
            do
              nome="${par%%:*}"; resultado="${par#*:}"
              case "$resultado" in
                success) nota="" ;;
                skipped) nota="desligada por input" ;;
                *)
                  if printf '%s' ",$SOFT_FAIL," | tr -d ' ' | grep -q ",$nome,"; then
                    nota="soft-fail: não bloqueia"
                  else
                    nota="**bloqueia**"
                  fi
                  ;;
              esac
              echo "| $nome | $resultado | $nota |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
