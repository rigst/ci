name: Site estático

# Pipeline para sites estáticos (HTML/CSS/JS sem build).
# Do pipeline Python só faz sentido a varredura de segredos; o resto é
# substituído por uma checagem de referências locais quebradas, que é o defeito
# que de fato aparece num site editado à mão.
#
#   jobs:
#     ci:
#       uses: rigst/ci/.github/workflows/static-site.yml@v1

on:
  workflow_call:
    inputs:
      run-gitleaks:
        type: boolean
        default: true
      run-link-check:
        description: "Verifica se href/src locais apontam para arquivos existentes."
        type: boolean
        default: true

      run-a11y:
        description: "Audita acessibilidade com axe-core. Desligado até o passivo ser medido."
        type: boolean
        default: false
      a11y-paths:
        description: |
          Caminhos auditados, um por linha. Vazio = audita todo *.html do
          repositório, que num site sem build é a cobertura completa.
        type: string
        default: ""
      a11y-tags:
        description: "Tags de regra do axe-core, separadas por vírgula."
        type: string
        default: "wcag2a,wcag2aa,wcag21a,wcag21aa"
      a11y-fail-on:
        description: "Impacto que reprova: minor, moderate, serious, critical ou none."
        type: string
        default: "serious"
      a11y-port:
        description: "Porta do servidor estático durante a auditoria."
        type: number
        default: 8001

      ci-ref:
        type: string
        default: "v1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (segredos)
    if: inputs.run-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref }}
          path: .ci-shared

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Escanear histórico
        run: |
          CFG=".gitleaks.toml"
          [ -f "$CFG" ] || CFG=".ci-shared/configs/gitleaks.toml"
          gitleaks git . --config "$CFG" --redact --verbose

  links:
    name: Referências locais
    if: inputs.run-link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar href/src locais
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          from urllib.parse import unquote, urlparse

          raiz = pathlib.Path(".")
          # Captura href="..." e src="..." em qualquer HTML do repositório.
          padrao = re.compile(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']', re.I)
          quebrados = []

          for html in raiz.rglob("*.html"):
              if ".ci-shared" in html.parts or ".git" in html.parts:
                  continue
              texto = html.read_text(encoding="utf-8", errors="replace")
              for bruto in padrao.findall(texto):
                  alvo = bruto.strip()
                  # Ignora o que não é caminho de arquivo local.
                  if not alvo or alvo.startswith(("#", "mailto:", "tel:", "data:", "javascript:")):
                      continue
                  if urlparse(alvo).scheme or alvo.startswith("//"):
                      continue
                  caminho = unquote(alvo.split("#")[0].split("?")[0])
                  if not caminho:
                      continue
                  base = raiz if caminho.startswith("/") else html.parent
                  destino = (base / caminho.lstrip("/")).resolve()
                  if not destino.exists():
                      quebrados.append(f"{html}: {alvo}")

          for q in sorted(quebrados):
              print(f"::error::referência local inexistente -> {q}")
          print(f"{len(quebrados)} referência(s) quebrada(s).")
          sys.exit(1 if quebrados else 0)
          PY

  # Acessibilidade. Aqui a auditoria pode ser completa sem configuração: um
  # site sem build tem todas as páginas em disco, então a lista padrão é
  # simplesmente todo *.html do repositório. Num projeto Django isso não é
  # possível — as URLs vêm do roteador, não da árvore de arquivos.
  a11y:
    name: acessibilidade (axe-core)
    if: inputs.run-a11y
    runs-on: ubuntu-latest
    # Rede travada num download (espelho de apt, registry do npm, CDN do
    # Playwright) já segurou um runner por vinte minutos sem uma linha de erro
    # no log. Com o limite, o job reprova rápido em vez de ficar pendurado.
    timeout-minutes: 20
    env:
      AXE_VERSION: "4.11.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Playwright e axe-core
        run: |
          pip install playwright
          playwright install chromium
          npm install --no-save --no-audit --no-fund "axe-core@${AXE_VERSION}"

      # Servidor de arquivos em vez de file://: as regras do axe que dependem
      # de origem (e o próprio carregamento de CSS relativo) se comportam de
      # outro jeito sob file://, e o resultado não corresponderia ao site no ar.
      - name: Servir o site
        run: |
          PORTA="${{ inputs.a11y-port }}"
          python -m http.server "$PORTA" --bind 127.0.0.1 \
            > "$RUNNER_TEMP/servidor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/servidor.pid"
          for _ in $(seq 1 20); do
            if curl -s -o /dev/null "http://127.0.0.1:$PORTA/"; then
              echo "servidor no ar"; exit 0
            fi
            sleep 1
          done
          echo "::error::o servidor estático não subiu"; exit 1

      - name: axe-core
        run: |
          LISTA="$RUNNER_TEMP/paths.txt"
          if printf '%s\n' "${{ inputs.a11y-paths }}" | grep -qE '[^[:space:]]'; then
            printf '%s\n' "${{ inputs.a11y-paths }}" \
              | tr -d '\r' | grep -vE '^[[:space:]]*(#.*)?$' > "$LISTA"
          else
            # Descoberta automática. `-prune` em vez de filtro depois: o
            # node_modules recém-instalado traz HTML de documentação, que não
            # é página do site e poluiria o relatório inteiro.
            find . \
              \( -path ./.git -o -path ./.ci-shared -o -path ./node_modules \) -prune \
              -o -name '*.html' -print \
              | sed 's|^\.||' | sort > "$LISTA"
          fi
          echo "--- páginas a auditar ---"; cat "$LISTA"
          ARGS=()
          while IFS= read -r caminho; do
            [ -n "$caminho" ] || continue
            ARGS+=(--paths "$caminho")
          done < "$LISTA"
          python .ci-shared/scripts/a11y.py \
            --base-url "http://127.0.0.1:${{ inputs.a11y-port }}" \
            --axe node_modules/axe-core/axe.min.js \
            --tags "${{ inputs.a11y-tags }}" \
            --fail-on "${{ inputs.a11y-fail-on }}" \
            --out a11y.json \
            "${ARGS[@]}"

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y
          path: a11y.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Derrubar o servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/servidor.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/servidor.pid")" || true
          fi

  # Portão único, igual ao do python-django.yml: é este check que o branch
  # protection deve exigir, não os jobs individuais.
  resultado:
    name: CI
    if: always()
    needs: [gitleaks, links, a11y]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar
        env:
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_LINKS: ${{ needs.links.result }}
          R_A11Y: ${{ needs.a11y.result }}
        run: |
          falhou=0
          verificar() {
            printf '%-10s %s' "$1" "$2"
            # `skipped` é resultado válido: a etapa foi desligada por input.
            case "$2" in
              success|skipped) echo "" ;;
              *) echo "  <-- BLOQUEIA"; falhou=1 ;;
            esac
          }
          verificar gitleaks "$R_GITLEAKS"
          verificar links    "$R_LINKS"
          verificar a11y     "$R_A11Y"
          exit "$falhou"
