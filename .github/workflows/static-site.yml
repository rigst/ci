name: Site estático

# Pipeline para sites estáticos (HTML/CSS/JS sem build).
# Do pipeline Python só faz sentido a varredura de segredos; o resto é
# substituído por uma checagem de referências locais quebradas, que é o defeito
# que de fato aparece num site editado à mão.
#
#   jobs:
#     ci:
#       uses: rigst/ci/.github/workflows/static-site.yml@v1

on:
  workflow_call:
    inputs:
      run-gitleaks:
        type: boolean
        default: true
      run-link-check:
        description: "Verifica se href/src locais apontam para arquivos existentes."
        type: boolean
        default: true

      run-a11y:
        description: "Audita acessibilidade com axe-core. Desligado até o passivo ser medido."
        type: boolean
        default: false
      a11y-paths:
        description: |
          Caminhos auditados, um por linha. Vazio = audita todo *.html do
          repositório, que num site sem build é a cobertura completa.
        type: string
        default: ""
      a11y-tags:
        description: "Tags de regra do axe-core, separadas por vírgula."
        type: string
        default: "wcag2a,wcag2aa,wcag21a,wcag21aa"
      a11y-fail-on:
        description: "Impacto que reprova: minor, moderate, serious, critical ou none."
        type: string
        default: "serious"
      a11y-port:
        description: "Porta do servidor estático durante a auditoria."
        type: number
        default: 8001

      # --- qualidade estática de frontend ---
      #
      # Num site sem build, o CSS e o JS são o produto: não há etapa de
      # compilação para pegar erro antes, e o único aviso possível é este.
      run-frontend:
        description: "Roda Stylelint no CSS e ESLint no JavaScript."
        type: boolean
        default: false
      frontend-paths:
        description: |
          Diretórios com o CSS e o JS, separados por espaço. O padrão `.` é
          seguro aqui porque um site estático não tem `venv/` para varrer —
          diferente do pipeline Django, onde a raiz trava o job.
        type: string
        default: "."
      run-stylelint:
        type: boolean
        default: true
      run-eslint:
        type: boolean
        default: true
      frontend-fail-on:
        description: "Severidade que reprova: erro, aviso ou nenhum."
        type: string
        default: "erro"

      # --- layout renderizado ---
      run-layout:
        description: "Mede overflow, alvos de toque e conteúdo coberto no navegador."
        type: boolean
        default: false
      layout-paths:
        description: |
          Caminhos medidos, um por linha. Vazio = mede todo *.html do
          repositório, como o a11y faz.
        type: string
        default: ""
      layout-larguras:
        description: "Larguras de viewport, em px, separadas por vírgula."
        type: string
        default: "390,768,1440"
      layout-fail-on:
        description: "Severidade que reprova: erro, aviso ou nenhum."
        type: string
        default: "erro"
      layout-alvo-minimo:
        description: "Lado mínimo de alvo clicável, em px (WCAG 2.5.8 pede 24)."
        type: number
        default: 24
      layout-port:
        description: "Porta do servidor estático durante a medição."
        type: number
        default: 8002

      # Chegou junto com as etapas de frontend: sem ele, ligar uma checagem nova
      # num site que já está verde é uma aposta de tudo ou nada. O pipeline
      # Django tem o mesmo mecanismo desde o começo.
      soft-fail:
        description: |
          Lista separada por vírgula das checagens que reportam sem derrubar o
          build. Valores aceitos: gitleaks, links, a11y, frontend, layout.
        type: string
        default: ""

      ci-ref:
        description: |
          Ref de rigst/ci de onde vêm os configs e os scripts compartilhados.

          Vazio (padrão) usa `github.job_workflow_sha`: o commit exato deste
          arquivo de workflow. É o que garante que o YAML e os scripts que ele
          executa venham do MESMO commit.

          O padrão era `"v1"` fixo, e isso quebrou de verdade: um projeto fixou
          o workflow no SHA de um commit de trabalho, como o README manda, e os
          jobs seguiram baixando os scripts da tag `v1` — que não tinha os
          arquivos novos. O sintoma foi `No such file or directory` em quatro
          scripts, sem nenhuma pista de que o `.ci-shared` viera de outro
          commit. Passe um valor aqui apenas para forçar uma ref diferente da
          do workflow, o que quase nunca é o que se quer.
        type: string
        default: ""

permissions:
  contents: read

env:
  # Versão usada pelos jobs de acessibilidade e de layout. Uma declaração só,
  # porque duas divergem na primeira vez que alguém sobe uma e esquece a
  # outra — e a medição de layout compara números de renderização, que um
  # Chromium diferente muda sem ninguém ter tocado no CSS.
  PLAYWRIGHT_VERSION: "1.62.0"

jobs:
  gitleaks:
    name: gitleaks (segredos)
    if: inputs.run-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || (github.job_workflow_sha != '' && github.job_workflow_sha || 'v1') }}
          path: .ci-shared

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          # --proto/--proto-redir travam o esquema em https inclusive no
          # redirecionamento: o -L segue para outro host, e sem isto um 302
          # para http seria seguido em silêncio.
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Escanear histórico
        run: |
          CFG=".gitleaks.toml"
          [ -f "$CFG" ] || CFG=".ci-shared/configs/gitleaks.toml"
          gitleaks git . --config "$CFG" --redact --verbose

  links:
    name: Referências locais
    if: inputs.run-link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar href/src locais
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          from urllib.parse import unquote, urlparse

          raiz = pathlib.Path(".")
          # Captura href="..." e src="..." em qualquer HTML do repositório.
          padrao = re.compile(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']', re.I)
          quebrados = []

          for html in raiz.rglob("*.html"):
              if ".ci-shared" in html.parts or ".git" in html.parts:
                  continue
              texto = html.read_text(encoding="utf-8", errors="replace")
              for bruto in padrao.findall(texto):
                  alvo = bruto.strip()
                  # Ignora o que não é caminho de arquivo local.
                  if not alvo or alvo.startswith(("#", "mailto:", "tel:", "data:", "javascript:")):
                      continue
                  if urlparse(alvo).scheme or alvo.startswith("//"):
                      continue
                  caminho = unquote(alvo.split("#")[0].split("?")[0])
                  if not caminho:
                      continue
                  base = raiz if caminho.startswith("/") else html.parent
                  destino = (base / caminho.lstrip("/")).resolve()
                  if not destino.exists():
                      quebrados.append(f"{html}: {alvo}")

          for q in sorted(quebrados):
              print(f"::error::referência local inexistente -> {q}")
          print(f"{len(quebrados)} referência(s) quebrada(s).")
          sys.exit(1 if quebrados else 0)
          PY

  # Acessibilidade. Aqui a auditoria pode ser completa sem configuração: um
  # site sem build tem todas as páginas em disco, então a lista padrão é
  # simplesmente todo *.html do repositório. Num projeto Django isso não é
  # possível — as URLs vêm do roteador, não da árvore de arquivos.
  a11y:
    name: acessibilidade (axe-core)
    if: inputs.run-a11y
    runs-on: ubuntu-latest
    # Rede travada num download (espelho de apt, registry do npm, CDN do
    # Playwright) já segurou um runner por vinte minutos sem uma linha de erro
    # no log. Com o limite, o job reprova rápido em vez de ficar pendurado.
    timeout-minutes: 20
    env:
      AXE_VERSION: "4.11.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || (github.job_workflow_sha != '' && github.job_workflow_sha || 'v1') }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # O checkout acima é silencioso quando erra: se a ref não tiver os
      # arquivos deste job, o passo seguinte morre com "No such file or
      # directory" e nada no log diz de qual commit o .ci-shared veio. Custou
      # duas rodadas de CI descobrir que ele estava vindo da `main`.
      - name: Conferir os scripts compartilhados
        run: |
          echo "ci-ref pedido: '${{ inputs.ci-ref }}'"
          echo "job_workflow_sha: '${{ github.job_workflow_sha }}'"
          echo "commit de .ci-shared: $(git -C .ci-shared rev-parse HEAD 2>/dev/null || echo '(sem git)')"
          faltando=""
          for s in scripts/layout.py; do
            [ -f ".ci-shared/$s" ] || faltando="$faltando $s"
          done
          if [ -n "$faltando" ]; then
            echo "::error::.ci-shared não tem:$faltando"
            echo "::error::o checkout de rigst/ci veio de uma ref sem estes arquivos."
            echo "::error::passe o input ci-ref com o mesmo commit usado no 'uses:'."
            exit 1
          fi

      - name: Instalar Playwright e axe-core
        run: |
          pip install --only-binary :all: "playwright==${PLAYWRIGHT_VERSION}"
          playwright install chromium
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            "axe-core@${AXE_VERSION}"

      # Servidor de arquivos em vez de file://: as regras do axe que dependem
      # de origem (e o próprio carregamento de CSS relativo) se comportam de
      # outro jeito sob file://, e o resultado não corresponderia ao site no ar.
      - name: Servir o site
        run: |
          PORTA="${{ inputs.a11y-port }}"
          python -m http.server "$PORTA" --bind 127.0.0.1 \
            > "$RUNNER_TEMP/servidor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/servidor.pid"
          for _ in $(seq 1 20); do
            if curl -s -o /dev/null "http://127.0.0.1:$PORTA/"; then
              echo "servidor no ar"; exit 0
            fi
            sleep 1
          done
          echo "::error::o servidor estático não subiu"; exit 1

      - name: axe-core
        run: |
          LISTA="$RUNNER_TEMP/paths.txt"
          if printf '%s\n' "${{ inputs.a11y-paths }}" | grep -qE '[^[:space:]]'; then
            printf '%s\n' "${{ inputs.a11y-paths }}" \
              | tr -d '\r' | grep -vE '^[[:space:]]*(#.*)?$' > "$LISTA"
          else
            # Descoberta automática. `-prune` em vez de filtro depois: o
            # node_modules recém-instalado traz HTML de documentação, que não
            # é página do site e poluiria o relatório inteiro.
            find . \
              \( -path ./.git -o -path ./.ci-shared -o -path ./node_modules \) -prune \
              -o -name '*.html' -print \
              | sed 's|^\.||' | sort > "$LISTA"
          fi
          echo "--- páginas a auditar ---"; cat "$LISTA"
          ARGS=()
          while IFS= read -r caminho; do
            [ -n "$caminho" ] || continue
            ARGS+=(--paths "$caminho")
          done < "$LISTA"
          python .ci-shared/scripts/a11y.py \
            --base-url "http://127.0.0.1:${{ inputs.a11y-port }}" \
            --axe node_modules/axe-core/axe.min.js \
            --tags "${{ inputs.a11y-tags }}" \
            --fail-on "${{ inputs.a11y-fail-on }}" \
            --out a11y.json \
            "${ARGS[@]}"

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y
          path: a11y.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Derrubar o servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/servidor.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/servidor.pid")" || true
          fi

  # Qualidade estática de CSS e JavaScript. Sem djlint: não há template Django
  # aqui, e o HTML já passa pelo axe-core e pela checagem de referências locais.
  frontend:
    name: frontend (CSS, JS)
    if: inputs.run-frontend
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'frontend') }}
    timeout-minutes: 15
    env:
      STYLELINT_VERSION: "16.26.1"
      ESLINT_VERSION: "9.39.5"
      GLOBALS_VERSION: "17.12.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || (github.job_workflow_sha != '' && github.job_workflow_sha || 'v1') }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Os três numa chamada só: com `--no-save` e sem package.json, cada
      # `npm install` seguinte reescreve a árvore e apaga o anterior.
      # O checkout acima é silencioso quando erra: se a ref não tiver os
      # arquivos deste job, o passo seguinte morre com "No such file or
      # directory" e nada no log diz de qual commit o .ci-shared veio. Custou
      # duas rodadas de CI descobrir que ele estava vindo da `main`.
      - name: Conferir os scripts compartilhados
        run: |
          echo "ci-ref pedido: '${{ inputs.ci-ref }}'"
          echo "job_workflow_sha: '${{ github.job_workflow_sha }}'"
          echo "commit de .ci-shared: $(git -C .ci-shared rev-parse HEAD 2>/dev/null || echo '(sem git)')"
          faltando=""
          for s in scripts/frontend_relatorio.py configs/stylelint.json configs/eslint.config.mjs; do
            [ -f ".ci-shared/$s" ] || faltando="$faltando $s"
          done
          if [ -n "$faltando" ]; then
            echo "::error::.ci-shared não tem:$faltando"
            echo "::error::o checkout de rigst/ci veio de uma ref sem estes arquivos."
            echo "::error::passe o input ci-ref com o mesmo commit usado no 'uses:'."
            exit 1
          fi

      - name: Instalar ferramentas
        run: |
          # --ignore-scripts: nenhuma das três ferramentas precisa de script de
          # ciclo de vida, e sem a flag um pacote comprometido na árvore de
          # dependências executaria código durante a instalação, dentro de um
          # runner que tem o checkout do projeto em mãos.
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            "stylelint@${STYLELINT_VERSION}" \
            "eslint@${ESLINT_VERSION}" \
            "globals@${GLOBALS_VERSION}"

      - name: Selecionar configurações
        run: |
          if [ -f .stylelintrc.json ] || [ -f .stylelintrc ] || [ -f stylelint.config.js ]; then
            echo "CONFIG_STYLELINT=" >> "$GITHUB_ENV"
          else
            echo "CONFIG_STYLELINT=--config .ci-shared/configs/stylelint.json" >> "$GITHUB_ENV"
          fi
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            echo "CONFIG_ESLINT=" >> "$GITHUB_ENV"
          else
            echo "CONFIG_ESLINT=--config .ci-shared/configs/eslint.config.mjs --no-config-lookup" >> "$GITHUB_ENV"
          fi

      # `--output-file` e não redirecionamento: o Stylelint manda o relatório
      # para stderr quando encontra alguma coisa, e um `2>/dev/null` apagaria
      # justamente o caso que interessa.
      - name: Stylelint
        if: inputs.run-stylelint
        continue-on-error: true
        run: |
          ALVOS=()
          for dir in ${{ inputs.frontend-paths }}; do
            [ -d "$dir" ] && ALVOS+=("$dir/**/*.css")
          done
          if [ ${#ALVOS[@]} -eq 0 ]; then
            echo "[]" > stylelint.json; exit 0
          fi
          # shellcheck disable=SC2086
          npx --no-install stylelint "${ALVOS[@]}" $CONFIG_STYLELINT \
            --ignore-pattern "**/*.min.css" \
            --ignore-pattern "**/.ci-shared/**" \
            --ignore-pattern "**/node_modules/**" \
            --formatter json --output-file stylelint.json || true
          [ -f stylelint.json ] || echo "[]" > stylelint.json

      - name: ESLint
        if: inputs.run-eslint
        continue-on-error: true
        run: |
          ALVOS=()
          for dir in ${{ inputs.frontend-paths }}; do
            [ -d "$dir" ] && ALVOS+=("$dir")
          done
          if [ ${#ALVOS[@]} -eq 0 ]; then
            echo "[]" > eslint.json; exit 0
          fi
          # shellcheck disable=SC2086
          npx --no-install eslint "${ALVOS[@]}" $CONFIG_ESLINT \
            --ignore-pattern ".ci-shared/**" \
            --format json -o eslint.json || true
          [ -f eslint.json ] || echo "[]" > eslint.json

      - name: Consolidar
        run: |
          ARGS=()
          [ -f stylelint.json ] && ARGS+=(--stylelint stylelint.json)
          [ -f eslint.json ] && ARGS+=(--eslint eslint.json)
          python .ci-shared/scripts/frontend_relatorio.py "${ARGS[@]}" \
            --fail-on "${{ inputs.frontend-fail-on }}" \
            --out frontend.json

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: |
            frontend.json
            stylelint.json
            eslint.json
          retention-days: 30
          if-no-files-found: ignore

  # Layout medido no navegador. Mesma montagem do a11y — servidor de arquivos em
  # vez de file://, porque sob file:// o CSS relativo se comporta de outro jeito
  # e medir largura de elemento sem folha de estilo não mede nada.
  layout:
    name: layout (Playwright)
    if: inputs.run-layout
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(inputs.soft-fail, 'layout') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: rigst/ci
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || (github.job_workflow_sha != '' && github.job_workflow_sha || 'v1') }}
          path: .ci-shared

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          # --only-binary :all: pelo mesmo motivo: instalar de sdist roda o
          # setup.py do pacote. Conferido que djlint e playwright resolvem a
          # árvore inteira só com wheels.
          pip install --only-binary :all: "playwright==${PLAYWRIGHT_VERSION}"
          playwright install chromium

      - name: Servir o site
        run: |
          PORTA="${{ inputs.layout-port }}"
          python -m http.server "$PORTA" --bind 127.0.0.1 \
            > "$RUNNER_TEMP/servidor-layout.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/servidor-layout.pid"
          for _ in $(seq 1 20); do
            if curl -s -o /dev/null "http://127.0.0.1:$PORTA/"; then
              echo "servidor no ar"; exit 0
            fi
            sleep 1
          done
          echo "::error::o servidor estático não subiu"; exit 1

      - name: Medir o layout
        run: |
          LISTA="$RUNNER_TEMP/layout-paths.txt"
          if printf '%s\n' "${{ inputs.layout-paths }}" | grep -qE '[^[:space:]]'; then
            printf '%s\n' "${{ inputs.layout-paths }}" \
              | tr -d '\r' | grep -vE '^[[:space:]]*(#.*)?$' > "$LISTA"
          else
            find . \
              \( -path ./.git -o -path ./.ci-shared -o -path ./node_modules \) -prune \
              -o -name '*.html' -print \
              | sed 's|^\.||' | sort > "$LISTA"
          fi
          echo "--- páginas a medir ---"; cat "$LISTA"
          ARGS=()
          while IFS= read -r caminho; do
            [ -n "$caminho" ] || continue
            ARGS+=(--paths "$caminho")
          done < "$LISTA"
          python .ci-shared/scripts/layout.py \
            --base-url "http://127.0.0.1:${{ inputs.layout-port }}" \
            --larguras "${{ inputs.layout-larguras }}" \
            --alvo-minimo "${{ inputs.layout-alvo-minimo }}" \
            --fail-on "${{ inputs.layout-fail-on }}" \
            --out layout.json \
            "${ARGS[@]}"

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout
          path: |
            layout.json
            ${{ runner.temp }}/servidor-layout.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Derrubar o servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/servidor-layout.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/servidor-layout.pid")" || true
          fi

  # Portão único, igual ao do python-django.yml: é este check que o branch
  # protection deve exigir, não os jobs individuais.
  resultado:
    name: CI
    if: always()
    needs: [gitleaks, links, a11y, frontend, layout]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar
        env:
          SOFT_FAIL: ${{ inputs.soft-fail }}
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_LINKS: ${{ needs.links.result }}
          R_A11Y: ${{ needs.a11y.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
          R_LAYOUT: ${{ needs.layout.result }}
        run: |
          falhou=0
          # Mesma função do python-django.yml, inclusive na consulta ao
          # soft-fail: a checagem é feita aqui, e não só via continue-on-error,
          # para não depender de como o Actions propaga o resultado de um job
          # tolerante.
          verificar() {
            nome="$1"; resultado="$2"
            printf '%-10s %s' "$nome" "$resultado"
            case "$resultado" in
              success|skipped) echo "" ;;
              *)
                if printf '%s' ",$SOFT_FAIL," | tr -d ' ' | grep -q ",$nome,"; then
                  echo "  (soft-fail: não bloqueia)"
                else
                  echo "  <-- BLOQUEIA"
                  falhou=1
                fi
                ;;
            esac
          }
          verificar gitleaks "$R_GITLEAKS"
          verificar links    "$R_LINKS"
          verificar a11y     "$R_A11Y"
          verificar frontend "$R_FRONTEND"
          verificar layout   "$R_LAYOUT"
          exit "$falhou"
