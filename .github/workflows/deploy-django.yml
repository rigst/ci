name: Deploy Django (CD)

# Chamado pelo deploy.yml de cada projeto, disparado por workflow_run depois
# que o CI (python-django.yml) conclui com sucesso em main. Este workflow não
# faz o deploy em si — só dispara, via SSH, o script já versionado no próprio
# repositório do app (deploy/cd-deploy.sh). Isso mantém a lógica de deploy
# revisável no histórico de cada projeto, e este workflow como só o
# "discador".
#
# O usuário remoto é uma conta dedicada (`deploy`, por padrão), não `rod`:
# a chave de deploy fica isolada das chaves pessoais e do sudo amplo que
# `rod` usa para administração interativa. Ver RUNBOOK.md seção 7.

on:
  workflow_call:
    inputs:
      ssh-host:
        description: "Host ou domínio do servidor onde o app roda."
        type: string
        required: true
      ssh-user:
        description: "Usuário SSH dedicado ao deploy (não o usuário admin do servidor)."
        type: string
        default: "deploy"
    secrets:
      CD_SSH_KEY:
        description: "Chave privada correspondente à pública em ~deploy/.ssh/authorized_keys deste app."
        required: true

permissions:
  contents: read

# Nunca dois deploys do mesmo app em paralelo: o segundo espera o primeiro
# terminar (não cancela) para nunca reiniciar o serviço no meio de um
# `pip install`/`migrate` em andamento.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Gravar chave privada
        # printf '%s\n', não '%s': a expressão ${{ }} do Actions corta a
        # quebra de linha final do secret ao interpolar, e uma chave OpenSSH
        # sem \n depois de "-----END...-----" faz o libcrypto recusar com um
        # erro sem relação nenhuma com a causa real.
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cd_key"
          printf '%s\n' "${{ secrets.CD_SSH_KEY }}" > "$RUNNER_TEMP/cd_key"

      - name: Fixar known_hosts
        # ssh-keyscan em tempo de execução seria TOFU fraco: confiaria
        # cegamente no que a rede devolvesse naquele instante. A impressão
        # digital é capturada uma vez, fora daqui, e guardada como variável
        # (não é segredo, é a chave pública do host).
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s' "${{ vars.SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"

      - name: Disparar deploy no servidor
        # O authorized_keys do usuário `deploy` força um comando fixo
        # (command=) e ignora o que mandarmos aqui — mas o sshd sempre
        # propaga o pedido original na variável SSH_ORIGINAL_COMMAND, que é
        # como o script do lado de lá sabe qual SHA implantar.
        #
        # head_sha só existe no evento workflow_run; o fallback pra github.sha
        # é o que permite testar este workflow via workflow_dispatch antes de
        # trocar para o gatilho automático (ver RUNBOOK.md seção 7.5).
        # Retry só na CONEXÃO, nunca no resultado do deploy: a rota
        # runner-hospedado -> VPS engasga de vez em quando (sem fail2ban nem
        # firewall envolvidos, confirmado), e o timeout padrão do ssh é de
        # minutos, não segundos. Repetir cegamente por qualquer falha seria
        # pior — reexecutaria um cd-deploy.sh que já rodou e falhou de
        # verdade (migration ruim, smoke-test vermelho), daí o grep no
        # stderr: só as mensagens do próprio cliente ssh justificam repetir.
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for tentativa in 1 2 3; do
            saida="$(ssh -i "$RUNNER_TEMP/cd_key" \
                -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
                -o StrictHostKeyChecking=yes \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}" \
                "deploy $DEPLOY_SHA" 2>&1)"
            codigo=$?
            printf '%s\n' "$saida"
            [ "$codigo" -eq 0 ] && exit 0
            if printf '%s' "$saida" | grep -qE "Connection timed out|Connection refused|Could not resolve|Connection closed by remote host|kex_exchange_identification|Connection reset by peer"; then
              echo "Falha de conexão (tentativa $tentativa/3), tentando de novo em 10s..."
              sleep 10
              continue
            fi
            # Não é falha de rede — é o cd-deploy.sh reportando erro de
            # verdade. Repetir não ajudaria, e poderia piorar (ex.: reaplicar
            # sobre um flock que ainda está segurando o deploy anterior).
            exit "$codigo"
          done
          echo "Sem conexão após 3 tentativas."
          exit 1
