name: Deploy Django (CD)

# Chamado pelo deploy.yml de cada projeto, disparado por workflow_run depois
# que o CI (python-django.yml) conclui com sucesso em main. Este workflow não
# faz o deploy em si — só dispara, via SSH, o script já versionado no próprio
# repositório do app (deploy/cd-deploy.sh). Isso mantém a lógica de deploy
# revisável no histórico de cada projeto, e este workflow como só o
# "discador".
#
# O usuário remoto é uma conta dedicada (`deploy`, por padrão), não `rod`:
# a chave de deploy fica isolada das chaves pessoais e do sudo amplo que
# `rod` usa para administração interativa. Ver RUNBOOK.md seção 7.

on:
  workflow_call:
    inputs:
      ssh-host:
        description: "Host ou domínio do servidor onde o app roda."
        type: string
        required: true
      ssh-user:
        description: "Usuário SSH dedicado ao deploy (não o usuário admin do servidor)."
        type: string
        default: "deploy"
    secrets:
      CD_SSH_KEY:
        description: "Chave privada correspondente à pública em ~deploy/.ssh/authorized_keys deste app."
        required: true

permissions:
  contents: read

# Nunca dois deploys do mesmo app em paralelo: o segundo espera o primeiro
# terminar (não cancela) para nunca reiniciar o serviço no meio de um
# `pip install`/`migrate` em andamento.
#
# O escopo é o repositório que CHAMA este workflow, não a frota: grupos de
# concorrência do Actions são por repositório, então dois apps diferentes
# deployam em paralelo mesmo com o mesmo nome de grupo. É o comportamento
# desejado aqui, mas já foi lido ao contrário — daí a nota.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # POR QUE TRÊS JOBS QUASE IGUAIS, E NENHUM RETRY DENTRO DO JOB
  #
  # Medição de 135 tentativas de deploy entre 30/08 e 12/09/2026: 127 limpas,
  # 8 com "Connection timed out" (5,9%). Nas 8, o número de retries bateu
  # EXATAMENTE no teto da política vigente — 3, 4, 4, 4, 4, 4, 5, 5. Nenhuma
  # com 1 ou 2, que seriam os casos em que insistir salvou o deploy.
  #
  # Ou seja: repetir dentro do mesmo job teve 0 de aproveitamento em 8
  # oportunidades. A conexão funciona na primeira tentativa ou não funciona
  # nunca naquele job, porque o descarte acompanha o IP de origem do runner,
  # não o relógio. Confirmado no host: zero [UFW BLOCK] em DPT=22, zero ban
  # do fail2ban, sem registro AAAA para cair em IPv6 quebrado, e o sshd
  # aceitando outros runners no MESMO segundo em que um levava timeout.
  #
  # Re-executar num runner novo funcionou 8 de 8, sempre de primeira e com
  # zero retries. É isso que estes jobs automatizam: cada um roda numa
  # máquina nova, logo com IP novo. Três tentativas levam a chance de falhar
  # de 5,9% para ~0,02%, supondo independência entre runners.
  #
  # A duplicação é literal porque o Actions não tem âncora de YAML, e porque
  # extrair para um script exigiria dar um checkout a um workflow que hoje
  # segura uma chave SSH e não baixa nada. Não vale trocar auditabilidade
  # por três blocos iguais.
  #
  # A causa de 5,9% dos IPs de runner serem inalcançáveis continua aberta, e
  # está acima do host — assunto para o provedor do VPS. Isto contorna.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      resultado: ${{ steps.ssh.outputs.resultado }}
    steps:
      - name: Gravar chave privada
        # printf '%s\n', não '%s': a expressão ${{ }} do Actions corta a
        # quebra de linha final do secret ao interpolar, e uma chave OpenSSH
        # sem \n depois de "-----END...-----" faz o libcrypto recusar com um
        # erro sem relação nenhuma com a causa real.
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cd_key"
          printf '%s\n' "${{ secrets.CD_SSH_KEY }}" > "$RUNNER_TEMP/cd_key"

      - name: Fixar known_hosts
        # ssh-keyscan em tempo de execução seria TOFU fraco: confiaria
        # cegamente no que a rede devolvesse naquele instante. A impressão
        # digital é capturada uma vez, fora daqui, e guardada como variável
        # (não é segredo, é a chave pública do host).
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s' "${{ vars.SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"

      - name: Disparar deploy no servidor
        id: ssh
        # UMA tentativa, e o passo nunca falha: classifica em ok/conexao/erro
        # e publica como output. Falhar aqui impediria o job seguinte de
        # distinguir rede de erro de deploy, e pintaria de vermelho uma
        # corrida que o runner seguinte ainda vai salvar. Quem decide é o job
        # `resultado`, no fim.
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if saida="$(ssh -i "$RUNNER_TEMP/cd_key" \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}" \
              "deploy $DEPLOY_SHA" 2>&1)"; then
            codigo=0
          else
            codigo=$?
          fi
          printf '%s\n' "$saida"
          if [ "$codigo" -eq 0 ]; then
            r=ok
          elif printf '%s' "$saida" | grep -qE "Connection timed out|Connection refused|Could not resolve|Connection closed by remote host|kex_exchange_identification|Connection reset by peer"; then
            r=conexao
          else
            # Não é rede: o cd-deploy.sh reportou erro de verdade (migration
            # ruim, smoke-test vermelho). Repetir noutro runner só reaplicaria
            # o mesmo erro, e poderia bater no flock do deploy anterior.
            r=erro
          fi
          echo "resultado=$r" >> "$GITHUB_OUTPUT"
          echo "resultado: $r"

  deploy_2:
    name: deploy (2º runner)
    needs: deploy
    if: needs.deploy.outputs.resultado == 'conexao'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      resultado: ${{ steps.ssh.outputs.resultado }}
    steps:
      - name: Gravar chave privada
        # printf '%s\n', não '%s': a expressão ${{ }} do Actions corta a
        # quebra de linha final do secret ao interpolar, e uma chave OpenSSH
        # sem \n depois de "-----END...-----" faz o libcrypto recusar com um
        # erro sem relação nenhuma com a causa real.
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cd_key"
          printf '%s\n' "${{ secrets.CD_SSH_KEY }}" > "$RUNNER_TEMP/cd_key"

      - name: Fixar known_hosts
        # ssh-keyscan em tempo de execução seria TOFU fraco: confiaria
        # cegamente no que a rede devolvesse naquele instante. A impressão
        # digital é capturada uma vez, fora daqui, e guardada como variável
        # (não é segredo, é a chave pública do host).
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s' "${{ vars.SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"

      - name: Disparar deploy no servidor
        id: ssh
        # UMA tentativa, e o passo nunca falha: classifica em ok/conexao/erro
        # e publica como output. Falhar aqui impediria o job seguinte de
        # distinguir rede de erro de deploy, e pintaria de vermelho uma
        # corrida que o runner seguinte ainda vai salvar. Quem decide é o job
        # `resultado`, no fim.
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if saida="$(ssh -i "$RUNNER_TEMP/cd_key" \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}" \
              "deploy $DEPLOY_SHA" 2>&1)"; then
            codigo=0
          else
            codigo=$?
          fi
          printf '%s\n' "$saida"
          if [ "$codigo" -eq 0 ]; then
            r=ok
          elif printf '%s' "$saida" | grep -qE "Connection timed out|Connection refused|Could not resolve|Connection closed by remote host|kex_exchange_identification|Connection reset by peer"; then
            r=conexao
          else
            # Não é rede: o cd-deploy.sh reportou erro de verdade (migration
            # ruim, smoke-test vermelho). Repetir noutro runner só reaplicaria
            # o mesmo erro, e poderia bater no flock do deploy anterior.
            r=erro
          fi
          echo "resultado=$r" >> "$GITHUB_OUTPUT"
          echo "resultado: $r"

  deploy_3:
    name: deploy (3º runner)
    needs: [deploy, deploy_2]
    if: needs.deploy_2.outputs.resultado == 'conexao'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      resultado: ${{ steps.ssh.outputs.resultado }}
    steps:
      - name: Gravar chave privada
        # printf '%s\n', não '%s': a expressão ${{ }} do Actions corta a
        # quebra de linha final do secret ao interpolar, e uma chave OpenSSH
        # sem \n depois de "-----END...-----" faz o libcrypto recusar com um
        # erro sem relação nenhuma com a causa real.
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cd_key"
          printf '%s\n' "${{ secrets.CD_SSH_KEY }}" > "$RUNNER_TEMP/cd_key"

      - name: Fixar known_hosts
        # ssh-keyscan em tempo de execução seria TOFU fraco: confiaria
        # cegamente no que a rede devolvesse naquele instante. A impressão
        # digital é capturada uma vez, fora daqui, e guardada como variável
        # (não é segredo, é a chave pública do host).
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s' "${{ vars.SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"

      - name: Disparar deploy no servidor
        id: ssh
        # UMA tentativa, e o passo nunca falha: classifica em ok/conexao/erro
        # e publica como output. Falhar aqui impediria o job seguinte de
        # distinguir rede de erro de deploy, e pintaria de vermelho uma
        # corrida que o runner seguinte ainda vai salvar. Quem decide é o job
        # `resultado`, no fim.
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if saida="$(ssh -i "$RUNNER_TEMP/cd_key" \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}" \
              "deploy $DEPLOY_SHA" 2>&1)"; then
            codigo=0
          else
            codigo=$?
          fi
          printf '%s\n' "$saida"
          if [ "$codigo" -eq 0 ]; then
            r=ok
          elif printf '%s' "$saida" | grep -qE "Connection timed out|Connection refused|Could not resolve|Connection closed by remote host|kex_exchange_identification|Connection reset by peer"; then
            r=conexao
          else
            # Não é rede: o cd-deploy.sh reportou erro de verdade (migration
            # ruim, smoke-test vermelho). Repetir noutro runner só reaplicaria
            # o mesmo erro, e poderia bater no flock do deploy anterior.
            r=erro
          fi
          echo "resultado=$r" >> "$GITHUB_OUTPUT"
          echo "resultado: $r"

  # Portão único: é este job que diz se o app foi implantado. Verde quando
  # QUALQUER um dos três conseguiu — um runner descartado no caminho não é
  # falha de deploy, é ruído de rede que o seguinte resolveu.
  resultado:
    name: CD
    needs: [deploy, deploy_2, deploy_3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir
        env:
          R1: ${{ needs.deploy.outputs.resultado }}
          R2: ${{ needs.deploy_2.outputs.resultado }}
          R3: ${{ needs.deploy_3.outputs.resultado }}
        run: |
          echo "tentativas: 1=${R1:-nao-rodou} 2=${R2:-nao-rodou} 3=${R3:-nao-rodou}"
          for r in "$R1" "$R2" "$R3"; do
            if [ "$r" = "ok" ]; then
              echo "deploy concluído"
              exit 0
            fi
          done
          if [ "$R1" = "erro" ] || [ "$R2" = "erro" ] || [ "$R3" = "erro" ]; then
            echo "::error::o deploy falhou no servidor — não é rede. Leia o log do job que reportou 'erro'."
          else
            echo "::error::nenhum dos 3 runners alcançou o host. Improvável por acaso (~0,02%): conferir o servidor antes de re-executar."
          fi
          exit 1
